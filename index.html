    // ═══════════════════════════════════════════════════════════════════════════════
    // WORD BUILDER
    // ═══════════════════════════════════════════════════════════════════════════════
    function WordBuilder({ wordSets, setWordSets, onBack, theme }) {
      const [group, setGroup] = useState("A");
      const [sylKey, setSylKey] = useState("1");
      const [bulk, setBulk] = useState("");

      const poolKey = group + sylKey;
      const words = wordSets[poolKey] && wordSets[poolKey].length ? wordSets[poolKey] : (POOLS[poolKey]||[]);

      function removeWord(w) {
        setWordSets(prev => ({ ...prev, [poolKey]: (prev[poolKey]||POOLS[poolKey]||[]).filter(x=>x!==w) }));
      }

      function addWords() {
        const incoming = bulk
          .split(/[\n,]/)
          .map(w=>w.trim().toLowerCase())
          .filter(Boolean);
        if (!incoming.length) return;
        setWordSets(prev => {
          const current = prev[poolKey] && prev[poolKey].length ? prev[poolKey] : (POOLS[poolKey]||[]);
          const merged = [...new Set([...current, ...incoming])];
          return { ...prev, [poolKey]: merged };
        });
        setBulk("");
      }

      function resetPool() {
        setWordSets(prev => ({ ...prev, [poolKey]: [...(POOLS[poolKey]||[])] }));
      }

      return (
        <div style={{
          height:"100%",width:"100%",overflowY:"auto",
          background:theme.bg,
          padding:"24px 16px 60px",
          fontFamily:"'Inter',sans-serif",
          animation:"fadeIn 0.35s ease both",
        }}>
          <div style={{width:"100%",maxWidth:"min(94vw, 640px)",margin:"0 auto"}}>
            <BuilderHeader title="Word Sets" onBack={onBack} />

            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
              {WORD_GROUPS.map(g=>(
                <button key={g} onClick={()=>setGroup(g)} style={{
                  flexBasis:"calc(20% - 5px)",flexGrow:1,padding:"9px 2px",borderRadius:10,
                  background: group===g ? theme.rhyme[g] : "rgba(255,255,255,0.09)",
                  color:      group===g ? "#111" : "rgba(255,255,255,0.6)",
                  fontFamily:"'Nunito'",fontWeight:900,fontSize:12,
                  border: group===g ? "none" : "1px solid rgba(255,255,255,0.12)",
                }}>{g}</button>
              ))}
            </div>

            <div style={{display:"flex",gap:6,marginBottom:16}}>
              {[["1","1 Syllable"],["2","2 Syllables"],["3","3 Syllables"]].map(([k,label])=>(
                <button key={k} onClick={()=>setSylKey(k)} style={{
                  flex:1,padding:"8px 2px",borderRadius:20,
                  background: sylKey===k ? "#fff" : "rgba(255,255,255,0.1)",
                  color:      sylKey===k ? "#3d31c4" : "rgba(255,255,255,0.65)",
                  fontSize:11,fontWeight:800,
                }}>{label}</button>
              ))}
            </div>

            <div style={{
              background:"rgba(255,255,255,0.09)",border:"1px solid rgba(255,255,255,0.12)",
              borderRadius:18,padding:16,marginBottom:16,
            }}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <span style={{fontSize:11,fontWeight:700,letterSpacing:1.5,color:"rgba(255,255,255,0.5)"}}>
                  {words.length} WORDS
                </span>
                <button onClick={resetPool} style={{
                  background:"none",color:"rgba(255,255,255,0.4)",fontSize:11,fontWeight:700,
                  textDecoration:"underline",
                }}>Reset to default</button>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6,maxHeight:220,overflowY:"auto"}}>
                {words.map(w=>(
                  <span key={w} style={{
                    display:"flex",alignItems:"center",gap:6,
                    background: theme.rhyme[group]+"33",
                    border:`1px solid ${theme.rhyme[group]}66`,
                    color:"#fff",borderRadius:20,padding:"5px 6px 5px 12px",
                    fontSize:13,fontWeight:600,
                  }}>
                    {w}
                    <button onClick={()=>removeWord(w)} style={{
                      width:18,height:18,borderRadius:"50%",
                      background:"rgba(0,0,0,0.25)",color:"#fff",fontSize:10,
                      display:"flex",alignItems:"center",justifyContent:"center",
                    }}>✕</button>
                  </span>
                ))}
                {!words.length && (
                  <span style={{fontSize:12,color:"rgba(255,255,255,0.35)"}}>No words yet — add some below.</span>
                )}
              </div>
            </div>

            <div style={{
              background:"rgba(255,255,255,0.09)",border:"1px solid rgba(255,255,255,0.12)",
              borderRadius:18,padding:16,
            }}>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:1.5,color:"rgba(255,255,255,0.5)",marginBottom:10}}>
                ADD WORDS TO GROUP {group} · {SYLLABLE_OPTS[parseInt(sylKey,10)-1]}
              </div>
              <textarea
                value={bulk}
                onChange={e=>setBulk(e.target.value)}
                placeholder="Paste or type words — separate with commas or new lines"
                rows={4}
                style={{
                  width:"100%",padding:"10px 12px",borderRadius:10,
                  background:"rgba(0,0,0,0.2)",border:"1px solid rgba(255,255,255,0.15)",
                  color:"#fff",fontSize:14,fontFamily:"inherit",resize:"vertical",marginBottom:10,
                }}
              />
              <button onClick={addWords} disabled={!bulk.trim()} style={{
                width:"100%",padding:"13px",borderRadius:12,
                background: bulk.trim() ? theme.rhyme[group] : "rgba(255,255,255,0.1)",
                color: bulk.trim() ? "#111" : "rgba(255,255,255,0.35)",
                fontFamily:"'Nunito'",fontWeight:900,fontSize:15,
              }}>+ Add Words</button>
            </div>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // GAME
    // ═══════════════════════════════════════════════════════════════════════════════
    function GameScreen({ bars,currentBar,inBuffer,bufferBars,beatInBar,beatFrac,isPlaying,justFinished,
      onPlay,onPause,onBack,beatName,bpm,scrollRef,rowRefs,theme }) {
      return (
        <div style={{
          height:"100%",width:"100%",
          background:theme.bg,
          display:"flex",flexDirection:"column",overflow:"hidden",
          fontFamily:"'Inter',sans-serif",
        }}>
          <div ref={scrollRef} style={{flex:1,overflowY:"scroll",overflowX:"hidden",paddingTop:16}}>
            <div style={{width:"100%",maxWidth:"min(94vw, 900px)",margin:"0 auto"}}>
              <BufferRow
                refCb={el=>{ if(el) rowRefs.current["buf"]=el; }}
                isCurrent={inBuffer}
                isPlaying={isPlaying}
                beatInBar={beatInBar}
                beatFrac={beatFrac}
                countdownNum={-currentBar}
                bufferBars={bufferBars}
              />
              {bars.map((bar,idx)=>{
                const isCur  = !inBuffer && idx===currentBar;
                const isPast = inBuffer ? false : idx<currentBar;
                const dist   = currentBar-idx;
                const opacity= isPast ? Math.max(0.15, 1-dist*0.13) : 1;
                return (
                  <BarRow
                    key={idx}
                    refCb={el=>{ if(el) rowRefs.current[idx]=el; }}
                    bar={bar}
                    isCurrent={isCur}
                    isPast={isPast}
                    opacity={opacity}
                    isPlaying={isPlaying}
                    beatInBar={beatInBar}
                    beatFrac={beatFrac}
                    theme={theme}
                  />
                );
              })}
              <div style={{height:300}}/>
            </div>
          </div>

          <BottomPanel
            isPlaying={isPlaying} justFinished={justFinished} onPlay={onPlay} onPause={onPause} onBack={onBack}
            beatName={beatName} bpm={bpm}
            currentBar={inBuffer ? -1 : currentBar} totalBars={bars.length}
            inBuffer={inBuffer} countdownNum={-currentBar}
            theme={theme}
          />
        </div>
      );
    }

    const TICK_POSITIONS = [12.5, 37.5, 62.5, 87.5];

    // A lead-in "count-in" bar shown before the freestyle content begins.
    // Visually similar to a normal bar row but shows a big countdown number
    // (bufferBars, bufferBars-1, ..., 1) instead of a rhyme word, giving the
    // user time to settle into the beat's tempo first.
    function BufferRow({ refCb, isCurrent, isPlaying, beatInBar, beatFrac, countdownNum, bufferBars }) {
      const bounceY     = Math.sin(beatFrac * Math.PI);
      const BALL_R      = 17;
      const rowPixH     = isCurrent ? ROW_H + 10 : ROW_H;
      const ballBottom  = 10 + bounceY * (rowPixH * 0.55);
      const fromPct     = TICK_POSITIONS[beatInBar];
      const toPct       = beatInBar < 3 ? TICK_POSITIONS[beatInBar + 1] : 97;
      const ballLeftPct = fromPct + (toPct - fromPct) * beatFrac;

      if (!isCurrent) return null;

      return (
        <div ref={refCb} style={{
          display:"flex",alignItems:"center",padding:"0 8px",marginBottom:5,
        }}>
          <div style={{width:30,flexShrink:0}} />
          <div style={{
            flex:1,height:rowPixH,position:"relative",
            borderRadius:12,
            outline:"3px solid rgba(255,255,255,0.9)",outlineOffset:2,
            boxShadow:"0 0 0 6px rgba(255,255,255,0.13), 0 10px 36px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.1)",
            background:"rgba(255,255,255,0.14)",
            display:"flex",alignItems:"center",justifyContent:"center",
          }}>
            <div style={{textAlign:"center"}}>
              <div style={{
                fontFamily:"'Nunito'",fontWeight:900,fontSize:34,color:"#fff",lineHeight:1,
              }}>{Math.max(1, Math.min(bufferBars, countdownNum))}</div>
              <div style={{
                fontSize:10,fontWeight:700,letterSpacing:1.5,color:"rgba(255,255,255,0.55)",marginTop:4,
              }}>GET READY</div>
            </div>

            <div style={{
              position:"absolute",bottom:8,left:"3%",right:"3%",height:2,
              background:"rgba(255,255,255,0.25)",borderRadius:1,pointerEvents:"none",
            }}/>
            {[0,1,2,3].map(i=>{
              const xPct = TICK_POSITIONS[i];
              const isActive = i===beatInBar;
              return (
                <div key={i} style={{
                  position:"absolute",bottom:4,left:`${xPct}%`,transform:"translateX(-50%)",
                  width:3,height:16,
                  background: isActive&&isPlaying ? "#fff" : "rgba(255,255,255,0.3)",
                  borderRadius:2,
                  boxShadow: isActive&&isPlaying ? "0 0 8px #fff" : "none",
                  pointerEvents:"none",
                }}/>
              );
            })}
            {isPlaying && (
              <>
                <div style={{
                  position:"absolute",bottom:7,left:`${ballLeftPct}%`,transform:"translateX(-50%)",
                  width:BALL_R*1.5,height:6,borderRadius:"50%",
                  background:"rgba(0,0,0,0.35)",filter:"blur(3px)",pointerEvents:"none",
                }}/>
                <div style={{
                  position:"absolute",bottom:ballBottom,left:`${ballLeftPct}%`,transform:"translateX(-50%)",
                  width:BALL_R*2,height:BALL_R*2,borderRadius:"50%",
                  background:"radial-gradient(circle at 33% 28%, #FFE97A, #F5AC26 52%, #C87E0A)",
                  boxShadow:"0 4px 18px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,255,255,0.2), 0 0 20px rgba(245,172,38,0.7)",
                  pointerEvents:"none",zIndex:20,
                }}/>
              </>
            )}
          </div>
          <div style={{width:30,flexShrink:0}} />
        </div>
      );
    }

    function BarRow({ refCb, bar, isCurrent, isPast, opacity, isPlaying, beatInBar, beatFrac, theme }) {
      // Colored by scheme SLOT (A=orange, B=blue, ...), not by the actual
      // rhyme family — this is what makes every "A" line in the freestyle
      // read as one consistent color and every "B" line as another, so the
      // AABB/ABAB/etc structure itself is visually obvious regardless of
      // which of the 20 word families is filling a given line.
      const color = bar.slot ? slotColor(bar.slot) : null;
      const bounceY     = Math.sin(beatFrac * Math.PI);
      const BALL_R      = 17;
      const rowPixH     = isCurrent ? ROW_H + 10 : ROW_H;
      const ballBottom  = 10 + bounceY * (rowPixH * 0.55);
      const fromPct     = TICK_POSITIONS[beatInBar];
      const toPct       = beatInBar < 3 ? TICK_POSITIONS[beatInBar + 1] : 97;
      const ballLeftPct = fromPct + (toPct - fromPct) * beatFrac;

      return (
        <div
          ref={refCb}
          style={{
            display:"flex",alignItems:"center",
            padding:"0 8px",marginBottom:5,
            opacity,
            transition:"opacity 0.45s ease",
          }}
        >
          <div style={{
            width:30,flexShrink:0,textAlign:"right",paddingRight:6,
            fontSize:11,color:"rgba(255,255,255,0.28)",fontWeight:600,
          }}>{bar.barNum}</div>

          <div style={{
            flex:1,
            height:rowPixH,
            position:"relative",
            display:"flex",gap:5,alignItems:"stretch",
            borderRadius:12,
            outline: isCurrent
              ? "3px solid rgba(255,255,255,0.9)"
              : "3px solid transparent",
            outlineOffset:2,
            boxShadow: isCurrent
              ? "0 0 0 6px rgba(255,255,255,0.13), 0 10px 36px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.1)"
              : "none",
            transition:"all 0.35s cubic-bezier(.4,0,.2,1)",
            overflow:"visible",
          }}>
            {[0,1,2].map(c=>(
              <div key={c} style={{
                flex:1,
                background: isCurrent
                  ? "rgba(255,255,255,0.22)"
                  : isPast
                    ? "rgba(255,255,255,0.05)"
                    : "rgba(255,255,255,0.10)",
                borderRadius:10,
                transition:"background 0.3s",
              }}/>
            ))}

            <div style={{
              flex:1,
              background: color
                ? (isCurrent ? color : isPast ? color+"77" : color+"aa")
                : (isCurrent ? "rgba(255,255,255,0.2)" : isPast ? "rgba(255,255,255,0.05)" : "rgba(255,255,255,0.1)"),
              borderRadius:10,
              display:"flex",alignItems:"center",justifyContent:"center",
              fontFamily:"'Nunito'",fontWeight:900,
              fontSize: !bar.word ? 14 : bar.word.length>7 ? 15 : bar.word.length>5 ? 19 : 23,
              color: color ? (isCurrent?"#111":"#222") : "rgba(255,255,255,0.2)",
              transition:"all 0.3s",
              userSelect:"none",
            }}>
              {bar.word||""}
            </div>

            {isCurrent && (
              <>
                <div style={{
                  position:"absolute",
                  bottom:8,left:"3%",right:"3%",
                  height:2,
                  background:"rgba(255,255,255,0.25)",
                  borderRadius:1,
                  pointerEvents:"none",
                }}/>
                {[0,1,2,3].map(i=>{
                  const xPct = TICK_POSITIONS[i];
                  const isActive = i===beatInBar;
                  return (
                    <div key={i} style={{
                      position:"absolute",
                      bottom:4,
                      left:`${xPct}%`,
                      transform:"translateX(-50%)",
                      width:3,height:16,
                      background: isActive&&isPlaying ? "#fff" : "rgba(255,255,255,0.3)",
                      borderRadius:2,
                      boxShadow: isActive&&isPlaying ? "0 0 8px #fff" : "none",
                      transition:"background 0.05s",
                      pointerEvents:"none",
                    }}/>
                  );
                })}
                {isPlaying && (
                  <>
                    <div style={{
                      position:"absolute",
                      bottom:7,
                      left:`${ballLeftPct}%`,
                      transform:"translateX(-50%)",
                      width:BALL_R*1.5,height:6,
                      borderRadius:"50%",
                      background:"rgba(0,0,0,0.35)",
                      filter:"blur(3px)",
                      pointerEvents:"none",
                    }}/>
                    <div style={{
                      position:"absolute",
                      bottom:ballBottom,
                      left:`${ballLeftPct}%`,
                      transform:"translateX(-50%)",
                      width:BALL_R*2,height:BALL_R*2,
                      borderRadius:"50%",
                      background:"radial-gradient(circle at 33% 28%, #FFE97A, #F5AC26 52%, #C87E0A)",
                      boxShadow:"0 4px 18px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,255,255,0.2), 0 0 20px rgba(245,172,38,0.7)",
                      pointerEvents:"none",
                      zIndex:20,
                    }}/>
                  </>
                )}
              </>
            )}
          </div>

          <div style={{
            width:30,flexShrink:0,paddingLeft:6,
            fontSize:11,color:"rgba(255,255,255,0.28)",fontWeight:600,
          }}>{bar.barNum}</div>
        </div>
      );
    }

    function BottomPanel({ isPlaying,justFinished,onPlay,onPause,onBack,beatName,bpm,currentBar,totalBars,inBuffer,countdownNum,theme }) {
      return (
        <div style={{
          background:"rgba(12,8,50,0.95)",
          backdropFilter:"blur(16px)",
          borderTop:"1px solid rgba(255,255,255,0.08)",
          padding:"14px 16px 22px",flexShrink:0,
        }}>
          <div style={{width:"100%",maxWidth:"min(94vw, 900px)",margin:"0 auto"}}>
          <div style={{
            textAlign:"center",fontSize:10,fontWeight:700,
            letterSpacing:2,color: justFinished ? "#22C55E" : "rgba(255,255,255,0.38)",
            marginBottom:3,textTransform:"uppercase",
          }}>
            {isPlaying
              ? (inBuffer ? "Get Ready…" : `Bar ${currentBar+1} of ${totalBars}`)
              : justFinished
                ? "🎉 FREESTYLE COMPLETE — WORDS SHUFFLED"
                : "GAME PAUSED"}
          </div>
          {!isPlaying && !justFinished && (
            <div style={{textAlign:"center",fontSize:11,color:"rgba(255,255,255,0.28)",marginBottom:10}}>
              Swipe Up &amp; Down On Screen to Scroll
            </div>
          )}
          {!isPlaying && justFinished && (
            <div style={{textAlign:"center",fontSize:11,color:"rgba(255,255,255,0.28)",marginBottom:10}}>
              Fresh words are ready — hit play to go again
            </div>
          )}

          <div style={{display:"flex",gap:8,justifyContent:"center",marginBottom:12}}>
            <button onClick={onBack} style={{
              background:"rgba(255,255,255,0.09)",color:"#fff",
              borderRadius:22,padding:"9px 18px",fontWeight:700,fontSize:13,
              border:"1px solid rgba(255,255,255,0.14)",
            }}>‹ BACK</button>

            <button onClick={isPlaying?onPause:onPlay} style={{
              background: isPlaying?"rgba(255,255,255,0.12)":theme.accent,
              color:"#fff",borderRadius:22,padding:"9px 26px",
              fontFamily:"'Nunito'",fontWeight:900,fontSize:15,
              border: isPlaying?"1px solid rgba(255,255,255,0.18)":"none",
              boxShadow: isPlaying?"none":`0 3px 18px ${theme.accent}8c`,
              transition:"all 0.15s",
            }}>
              {isPlaying?"⏸ Pause":justFinished?"▶ Play Again":"▶ Play Beat"}
            </button>

            <button style={{
              background:"rgba(255,255,255,0.09)",color:"#fff",
              borderRadius:22,padding:"9px 18px",fontWeight:700,fontSize:13,
              border:"1px solid rgba(255,255,255,0.14)",
            }}>FWD ›</button>
          </div>

          <div style={{
            display:"flex",alignItems:"center",gap:12,
            background:"rgba(255,255,255,0.06)",borderRadius:12,padding:"10px 14px",
          }}>
            <div style={{
              width:44,height:44,borderRadius:8,flexShrink:0,
              background:"linear-gradient(135deg,#7c3aed,#2563eb)",
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,
            }}>🎵</div>
            <div style={{flex:1}}>
              <div style={{fontFamily:"'Nunito'",fontWeight:800,fontSize:14,color:"#fff"}}>{beatName} Beat</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.35)"}}>
                {bpm} BPM
              </div>
            </div>
            <div style={{width:64,display:"flex",flexDirection:"column",gap:4}}>
              <div style={{height:3,background:"rgba(255,255,255,0.1)",borderRadius:2,overflow:"hidden"}}>
                <div style={{
                  height:"100%",
                  width: inBuffer ? "0%" : `${Math.round((currentBar/Math.max(1,totalBars-1))*100)}%`,
                  background:"#EAB308",borderRadius:2,transition:"width 0.5s",
                }}/>
              </div>
            </div>
          </div>

          <div style={{
            textAlign:"center",marginTop:10,
            fontFamily:"'Nunito'",fontWeight:900,fontSize:12,
            color:"rgba(255,255,255,0.18)",
          }}>created by ryx, higgis</div>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // RENDER
    // ═══════════════════════════════════════════════════════════════════════════════
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<RhymeGame />);
  </script>
</body>
</html>
