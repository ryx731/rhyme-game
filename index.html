<!DOCTYPE html>
<html lang="en">

    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap');
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      background: #4a3fd4;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    #root {
      height: 100vh;
      width: 100vw;
      display: flex;
      max-height: 100vh;
    }
    /* Force the single top-level screen div to fill #root — without this,
       a flex child with no explicit width/height shrinks to its content
       size and gets pinned to the top-left, which is the bug that made
       the game look tiny/misplaced on both desktop and mobile. */
    #root > * {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }
    /* Desktop fullscreen priority */
    @media (min-width: 1024px) {
      html, body {
        height: 100%;
      }
      #root {
        height: 100vh;
      }
    }
    /* Mobile optimization */
    @media (max-width: 1023px) {
      html, body {
        height: 100%;
        height: 100dvh;
      }
      #root {
        height: 100dvh;
      }
    }
    ::-webkit-scrollbar {
      width: 0;
    }
    button {
      cursor: pointer;
      font-family: inherit;
      border: none;
      outline: none;
    }
    input[type="range"] {
      accent-color: #0EA5E9;
    }
    input[type="text"],
    input[type="file"],
    textarea {
      -webkit-appearance: none;
      appearance: none;
      font-size: 16px; /* Prevents auto-zoom on iOS */
      font-family: inherit;
    }
    textarea {
      -webkit-appearance: none;
      appearance: none;
      font-size: 16px;
    }
  </style>

    function getPool(grp, syl, sets) {
      if (!grp) return [];
      const pools = sets || POOLS;
      const pick = (k) => (pools[k] && pools[k].length ? pools[k] : POOLS[k]) || [];
      if (syl==="1 Syllable") return pick(grp+"1");
      if (syl==="2 Syllables") return pick(grp+"2");
      if (syl==="3 Syllables") return pick(grp+"3");
      return [...pick(grp+"1"),...pick(grp+"2"),...pick(grp+"3")];
    }

    function shuffle(arr){ 
      const a=[...arr]; 
      for(let i=a.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      } 
      return a; 
    }

    // Picks a random, non-repeating actual word-group letter (A–H) for each
    // abstract slot ("A"/"B") that a scheme's pattern uses. This is what lets
    // a session pull from any of the 8 rhyme families instead of always
    // literally being groups A and B — the single biggest lever on perceived
    // word variety, since every family has its own ~15-40 word pool.
    function assignRandomGroups(scheme) {
      const slots = [...new Set(scheme.pattern.filter(Boolean))];
      const pool = shuffle(WORD_GROUPS);
      const map = {};
      slots.forEach((slot, i) => { map[slot] = pool[i % pool.length]; });
      return map;
    }

    function buildBars(scheme, syl, numBars, sets, groupMap) {
      // Only build pools for the groups this scheme actually uses (currently
      // just A/B), but this works for any of the 8 word groups so future
      // schemes can reference more of them without any code changes here.
      const neededSlots = [...new Set(scheme.pattern.filter(g => g))];
      const used = {};
      const pools = {};
      neededSlots.forEach(slot => {
        const actualGroup = (groupMap && groupMap[slot]) || slot;
        used[slot] = 0;
        pools[slot] = shuffle(getPool(actualGroup, syl, sets));
      });
      return Array.from({length:numBars},(_,i)=>{
        const slot = scheme.pattern[i%scheme.pattern.length];
        let word = null;
        const actualGroup = slot ? ((groupMap && groupMap[slot]) || slot) : null;
        if (slot) { word = pools[slot][used[slot]%Math.max(1,pools[slot].length)]; used[slot]++; }
        return { barNum:i+1, word, group:actualGroup };
      });
    }

    // ─── BPM Detection ────────────────────────────────────────────────────────────
    // Lightweight onset-detection + autocorrelation tempo estimator. Not
    // studio-grade, but good enough to give a solid starting guess for any
    // uploaded or fetched track — the BPM slider stays fully editable
    // afterward in case it guesses wrong (very syncopated beats, silence at
    // the start, etc).
    function detectBPM(audioBuffer) {
      try {
        const sampleRate = audioBuffer.sampleRate;
        const raw = audioBuffer.getChannelData(0);
        // Only analyze the first ~45s — plenty for a stable tempo estimate
        // and keeps this fast even on long tracks.
        const analyzeSamples = Math.min(raw.length, sampleRate * 45);

        // Collapse to a coarse energy envelope (~200 frames/sec).
        const chunkSize = Math.max(1, Math.floor(sampleRate / 200));
        const numChunks = Math.floor(analyzeSamples / chunkSize);
        if (numChunks < 20) return null;
        const envelope = new Float32Array(numChunks);
        for (let i = 0; i < numChunks; i++) {
          let sum = 0;
          const start = i * chunkSize;
          for (let j = 0; j < chunkSize; j++) {
            const v = raw[start + j];
            sum += v * v;
          }
          envelope[i] = Math.sqrt(sum / chunkSize);
        }

        // Onset/novelty function: positive-only energy rises (percussive hits).
        const novelty = new Float32Array(numChunks);
        for (let i = 1; i < numChunks; i++) {
          const d = envelope[i] - envelope[i - 1];
          novelty[i] = d > 0 ? d : 0;
        }

        // Autocorrelate the novelty curve across lags spanning 60–200 BPM,
        // picking the lag (i.e. beat period) with the strongest self-similarity.
        const chunkRate = sampleRate / chunkSize;
        const minLag = Math.max(1, Math.round(chunkRate * 60 / 200));
        const maxLag = Math.round(chunkRate * 60 / 60);
        let bestLag = minLag, bestScore = -Infinity;
        for (let lag = minLag; lag <= maxLag; lag++) {
          let score = 0;
          for (let i = 0; i + lag < numChunks; i++) {
            score += novelty[i] * novelty[i + lag];
          }
          if (score > bestScore) { bestScore = score; bestLag = lag; }
        }
        if (bestScore <= 0) return null;

        let bpm = (60 * chunkRate) / bestLag;
        // Fold octave errors (half/double time) into a musically typical range.
        while (bpm < 70) bpm *= 2;
        while (bpm > 180) bpm /= 2;
        return Math.round(bpm);
      } catch (e) {
        console.error("BPM detection failed:", e);
        return null;
      }
    }

    // ─── Audio ────────────────────────────────────────────────────────────────────
    function makeEngine(ctx, style) {
      function kick(t){
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);
        g.gain.setValueAtTime(1.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
        o.start(t);o.stop(t+0.4);
      }
      function snare(t){
        const len=ctx.sampleRate*0.18,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
        for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
        const src=ctx.createBufferSource();src.buffer=buf;
        const f=ctx.createBiquadFilter();f.type="highpass";f.frequency.value=1800;
        const g=ctx.createGain();src.connect(f);f.connect(g);g.connect(ctx.destination);
        g.gain.setValueAtTime(0.8,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
        src.start(t);src.stop(t+0.22);
      }
      function hat(t,vol=0.3){
        const len=ctx.sampleRate*0.05,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
        for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
        const src=ctx.createBufferSource();src.buffer=buf;
        const f=ctx.createBiquadFilter();f.type="highpass";f.frequency.value=9000;
        const g=ctx.createGain();src.connect(f);f.connect(g);g.connect(ctx.destination);
        g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
        src.start(t);src.stop(t+0.07);
      }
      return (time,bib,spb)=>{
        if(style==="boom-bap"){
          if(bib===0){kick(time);hat(time,0.2);}
          if(bib===1)hat(time,0.25);
          if(bib===2){snare(time);kick(time+spb*0.5);hat(time,0.2);}
          if(bib===3)hat(time,0.3);
        } else if(style==="lofi"){
          if(bib===0)kick(time);
          if(bib===1)hat(time,0.18);
          if(bib===2)snare(time);
          if(bib===3)hat(time,0.14);
          hat(time+spb*0.5,0.08);
        } else {
          if(bib===0||bib===2)kick(time);
          if(bib===1||bib===3)snare(time);
          for(let i=0;i<4;i++)hat(time+(spb/4)*i,0.1+(i%2===0?0.08:0));
        }
      };
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // ROOT
    // ═══════════════════════════════════════════════════════════════════════════════
    function RhymeGame() {
      const [screen,    setScreen]    = useState("landing");
      const [schemeIdx, setSchemeIdx] = useState(0);
      const [sylIdx,    setSylIdx]    = useState(3);
      const [beatIdx,   setBeatIdx]   = useState(0);
      const [durIdx,    setDurIdx]    = useState(1);
      const [bars,      setBars]      = useState([]);
      const [ballSpeed, setBallSpeed] = useState(1);
      const [justFinished, setJustFinished] = useState(false);

      const [beats, setBeats] = useState(DEFAULT_BEATS);
      const [wordSets, setWordSets] = useState(() => JSON.parse(JSON.stringify(POOLS)));
      const storageLoaded = useRef(false);
      const [storageReady, setStorageReady] = useState(false);

      const [isPlaying,   setIsPlaying]   = useState(false);
      const [currentBar,  setCurrentBar]  = useState(0);
      const [beatInBar,   setBeatInBar]   = useState(0);
      const [beatFrac,    setBeatFrac]    = useState(0);

      const audioCtx  = useRef(null);
      const schedFn   = useRef(null);
      const timerRef  = useRef(null);
      const animRef   = useRef(null);
      const startT    = useRef(0);
      const nextT     = useRef(0);
      const bCount    = useRef(0);
      const rowRefs   = useRef({});
      const scrollRef = useRef(null);

      // Load any previously saved beats/word sets from persistent storage once
      // on mount. Using window.storage instead of localStorage because
      // localStorage isn't available/reliable inside the artifact sandbox.
      useEffect(() => {
        (async () => {
          try {
            const savedBeats = await window.storage.get('rhyme_beats', false);
            if (savedBeats && savedBeats.value) {
              const parsed = JSON.parse(savedBeats.value);
              // Uploaded/online beats' audio can't be persisted as raw bytes
              // (see the save effect below). Local uploads have no way to
              // re-fetch their audio, so a stale entry with no audioData is
              // dropped. Online-library beats DO keep their "url" though, so
              // those are kept and simply re-fetched lazily next time they're
              // played (see ensureBeatAudio).
              const cleaned = Array.isArray(parsed)
                ? parsed.filter(b => b.style !== "upload" || !!b.url)
                : [];
              if (cleaned.length) setBeats(cleaned);
            }
          } catch (e) { /* nothing saved yet */ }
          try {
            const savedWords = await window.storage.get('rhyme_words', false);
            if (savedWords && savedWords.value) {
              setWordSets(JSON.parse(savedWords.value));
            }
          } catch (e) { /* nothing saved yet */ }
          storageLoaded.current = true;
          setStorageReady(true);
        })();
      }, []);

      useEffect(() => {
        if (!storageReady) return;
        (async () => {
          try {
            // An ArrayBuffer can't survive JSON.stringify (it silently turns into "{}"),
            // so persisting an uploaded beat's raw audio here would just corrupt it and
            // fail to decode on the next load. Save everything except that binary data.
            // Beats fetched from the online library keep their "url" field, so they can
            // be silently re-fetched next time instead of being lost like local uploads.
            const toSave = beats.map(b => {
              if (b.style === "upload") {
                const { audioData, ...rest } = b;
                return rest;
              }
              return b;
            });
            await window.storage.set('rhyme_beats', JSON.stringify(toSave), false);
          } catch (e) {
            console.error("Could not save beats:", e);
          }
        })();
      }, [beats, storageReady]);

      useEffect(() => {
        if (!storageReady) return;
        (async () => {
          try {
            await window.storage.set('rhyme_words', JSON.stringify(wordSets), false);
          } catch (e) {
            console.error("Could not save word sets:", e);
          }
        })();
      }, [wordSets, storageReady]);

      useEffect(() => {
        if (beatIdx > beats.length - 1) setBeatIdx(0);
      }, [beats, beatIdx]);

      const scheme  = SCHEMES[schemeIdx];
      const beat    = beats[beatIdx] || beats[0] || DEFAULT_BEATS[0];
      const bpm     = beat.bpm;
      const spb     = 60 / (bpm * ballSpeed);
      const numBars = DURATIONS[durIdx];
      const syl     = SYLLABLE_OPTS[sylIdx];

      useEffect(() => {
        setBars(buildBars(scheme, syl, numBars, wordSets));
      }, [schemeIdx, sylIdx, numBars, wordSets]);

      useEffect(() => {
        if (screen !== "game") return;
        const el = rowRefs.current[currentBar];
        const cont = scrollRef.current;
        if (!el || !cont) return;
        const target = el.offsetTop - cont.clientHeight * 0.30;
        cont.scrollTo({ top: Math.max(0, target), behavior: "smooth" });
      }, [currentBar, screen]);

      const startSession = () => {
        // Fresh shuffle of words every time a freestyle session begins, and a
        // fresh random assignment of which of the 8 rhyme families the
        // scheme's "A"/"B" slots pull from — so replaying with the same
        // settings gives you both new words AND a different rhyme sound
        // instead of always landing on the same two families.
        const groupMap = assignRandomGroups(scheme);
        setBars(buildBars(scheme, syl, numBars, wordSets, groupMap));
        setCurrentBar(0); setBeatInBar(0); setBeatFrac(0);
        bCount.current = 0; setIsPlaying(false); setJustFinished(false);
        setScreen("game");
      };

      const startPlay = useCallback(() => {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) {
          alert("Web Audio API not supported on this browser.");
          return;
        }
        setJustFinished(false);

        // If we already have a live context (user hit Pause, not Back), just
        // resume it instead of tearing it down and building a new one. Mobile
        // browsers cap how many AudioContexts can exist at once, and closing +
        // recreating one on every Play/Pause press is exactly the kind of thing
        // that quietly exhausts that cap and leaves you with silent audio.
        // Bonus: ctx.currentTime freezes while suspended, so resuming also
        // continues the beat/bar timing from exactly where it left off.
        if (audioCtx.current) {
          const ctx = audioCtx.current;
          ctx.resume().then(() => {
            if (beat.style !== "upload") {
              const sched = () => {
                while (nextT.current < ctx.currentTime + 0.12) {
                  schedFn.current(nextT.current, bCount.current % 4, spb);
                  nextT.current += spb;
                  bCount.current++;
                }
                timerRef.current = setTimeout(sched, 20);
              };
              sched();
            }
            setIsPlaying(true);
          });
          return;
        }

        const ctx = new AudioContext();
        const resumeAndPlay = () => {
          audioCtx.current = ctx;

          const playDecodedBuffer = (arrayBuffer) => {
            // Always decode a copy (slice(0)) — decodeAudioData detaches the
            // buffer it's given, so decoding the original stored/cached
            // buffer directly would break every playback after the first.
            ctx.decodeAudioData(arrayBuffer.slice(0), (buffer) => {
              const src = ctx.createBufferSource();
              src.buffer = buffer;
              src.connect(ctx.destination);
              src.loop = true;
              src.start(0);
              startT.current = ctx.currentTime;
              setIsPlaying(true);
            }, (err) => {
              console.error("Decode error:", err);
              alert("Could not play this beat");
              audioCtx.current = null;
              ctx.close();
            });
          };

          if (beat.style === "upload" && beat.audioData) {
            // Local upload or an already-fetched online-library track.
            playDecodedBuffer(beat.audioData);
          } else if (beat.style === "upload" && beat.url) {
            // Online-library beat whose audio hasn't been fetched yet this
            // session (e.g. right after a page reload, since raw audio bytes
            // aren't persisted). Fetch it now, then play it, and cache the
            // bytes on the beat object so this only happens once.
            fetch(beat.url)
              .then(res => {
                if (!res.ok) throw new Error("HTTP " + res.status);
                return res.arrayBuffer();
              })
              .then(arrayBuffer => {
                setBeats(prev => prev.map(b => b === beat ? { ...b, audioData: arrayBuffer } : b));
                playDecodedBuffer(arrayBuffer);
              })
              .catch(err => {
                console.error("Fetch error:", err);
                alert("Could not load this beat from the library. Check your connection and try again.");
                audioCtx.current = null;
                ctx.close();
              });
          } else {
            // Play synthesized beat
            schedFn.current = makeEngine(ctx, beat.style);
            nextT.current = ctx.currentTime + 0.05;
            startT.current = ctx.currentTime + 0.05;
            bCount.current = 0;
            const sched = () => {
              while (nextT.current < ctx.currentTime + 0.12) {
                schedFn.current(nextT.current, bCount.current % 4, spb);
                nextT.current += spb;
                bCount.current++;
              }
              timerRef.current = setTimeout(sched, 20);
            };
            sched();
            setIsPlaying(true);
          }
        };
        
        // Some mobile browsers report the context as already "running" even
        // though audio is still locked until a real sound plays, so resume()
        // unconditionally (it's a harmless no-op if already running) and play
        // a single silent sample first — the standard mobile "unlock" trick —
        // before doing anything else.
        const unlock = () => {
          const silentBuf = ctx.createBuffer(1, 1, 22050);
          const silentSrc = ctx.createBufferSource();
          silentSrc.buffer = silentBuf;
          silentSrc.connect(ctx.destination);
          silentSrc.start(0);
        };
        ctx.resume().then(() => {
          unlock();
          resumeAndPlay();
        }).catch((err) => {
          console.error("AudioContext resume failed:", err);
          unlock();
          resumeAndPlay();
        });
      }, [beat.style, beat.audioData, beat.url, spb]);

      const pausePlay = useCallback(() => {
        clearTimeout(timerRef.current);
        cancelAnimationFrame(animRef.current);
        // Suspend, don't close — keeps the same AudioContext alive so Play can
        // resume it instantly instead of creating a brand new one.
        if (audioCtx.current) {
          audioCtx.current.suspend();
        }
        setIsPlaying(false);
      }, []);

      const closeAudio = useCallback(() => {
        clearTimeout(timerRef.current);
        cancelAnimationFrame(animRef.current);
        if (audioCtx.current) {
          const ctx = audioCtx.current;
          audioCtx.current = null;
          ctx.close();
        }
        setIsPlaying(false);
      }, []);

      // Called once the last bar has fully played through. Stops all audio
      // (closing the AudioContext kills the loop/scheduler for good, instead
      // of letting the beat keep looping forever) and shuffles a brand new
      // set of words (and rhyme families) in for the next freestyle.
      const finishSession = useCallback(() => {
        closeAudio();
        setJustFinished(true);
        setBars(buildBars(scheme, syl, numBars, wordSets, assignRandomGroups(scheme)));
      }, [closeAudio, scheme, syl, numBars, wordSets]);

      useEffect(() => {
        if (!isPlaying) return;
        let lastBar = -1;
        let finished = false;
        const tick = () => {
          const ctx = audioCtx.current;
          if (!ctx) return;
          const elapsed = Math.max(0, ctx.currentTime - startT.current);
          const total   = elapsed / spb;
          const barIdx  = Math.floor(total / 4);

          if (barIdx >= bars.length) {
            if (!finished) {
              finished = true;
              setCurrentBar(bars.length - 1);
              setBeatInBar(3);
              setBeatFrac(0);
              finishSession();
            }
            return; // stop scheduling further ticks — session is over
          }

          setBeatInBar(Math.floor(total) % 4);
          setBeatFrac(total % 1);
          if (barIdx !== lastBar) {
            lastBar = barIdx;
            setCurrentBar(barIdx);
          }
          animRef.current = requestAnimationFrame(tick);
        };
        animRef.current = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(animRef.current);
      }, [isPlaying, spb, bars.length, finishSession]);

      useEffect(() => () => closeAudio(), [closeAudio]);

      const goHome = () => { closeAudio(); setScreen("home"); };

      return (
        <>
          <style>{`
            @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
            @keyframes spin{to{transform:rotate(360deg)}}
          `}</style>

          {screen === "landing" && (
            <LandingScreen onBegin={() => setScreen("home")} />
          )}

          {screen === "home" && (
            <HomeScreen
              schemeIdx={schemeIdx} setSchemeIdx={setSchemeIdx}
              sylIdx={sylIdx}       setSylIdx={setSylIdx}
              beatIdx={beatIdx}     setBeatIdx={setBeatIdx}
              durIdx={durIdx}       setDurIdx={setDurIdx}
              ballSpeed={ballSpeed} setBallSpeed={setBallSpeed}
              bars={bars}           scheme={scheme}
              beats={beats} setBeats={setBeats}
              wordSets={wordSets} setWordSets={setWordSets}
              onStart={startSession}
            />
          )}

          {screen === "game" && (
            <GameScreen
              bars={bars}
              currentBar={currentBar}
              beatInBar={beatInBar}
              beatFrac={beatFrac}
              isPlaying={isPlaying}
              justFinished={justFinished}
              onPlay={startPlay}
              onPause={pausePlay}
              onBack={goHome}
              beatName={beat.name}
              bpm={bpm}
              ballSpeed={ballSpeed}
              scrollRef={scrollRef}
              rowRefs={rowRefs}
            />
          )}
        </>
      );
    }

      );

    function BeatBuilder({ beats, setBeats, activeIdx, setActiveIdx, onBack }) {
      const [name, setName]   = useState("");
      const [bpm,  setBpm]    = useState(95);
      const [style,setStyle]  = useState("boom-bap");
      const [previewIdx, setPreviewIdx] = useState(null);
      const [uploadName, setUploadName] = useState("");
      const [uploadFile, setUploadFile] = useState(null);
      const [uploadBpm, setUploadBpm] = useState(95);
      const [editIdx, setEditIdx] = useState(null);
      const [editName, setEditName] = useState("");
      const [editBpm, setEditBpm] = useState(90);

      // Online library state: tracks which QUICK_PICK_BEATS entry (by name)
      // is currently being fetched, any per-item error, and a free-form URL
      // for pulling in beats beyond the curated list.
      const [libraryBusy, setLibraryBusy] = useState(null);
      const [libraryError, setLibraryError] = useState(null);
      const [customUrl, setCustomUrl] = useState("");
      const [customName, setCustomName] = useState("");
      const [customBpm, setCustomBpm] = useState(95);
      const [customBusy, setCustomBusy] = useState(false);
      const [customError, setCustomError] = useState(null);

      const previewCtx  = useRef(null);
      const previewTimer= useRef(null);
      const uploadAudioRef = useRef(null);

      const stopPreview = useCallback(() => {
        clearTimeout(previewTimer.current);
        previewCtx.current?.close();
        previewCtx.current = null;
        setPreviewIdx(null);
      }, []);

      useEffect(() => () => {
        stopPreview();
        uploadAudioRef.current?.close();
      }, [stopPreview]);

      function togglePreview(idx, b) {
        if (previewIdx === idx) { stopPreview(); return; }
        if (b.style === "upload") {
          previewUploadedBeat(b, idx);
        } else {
          stopPreview();
          const ctx = new (window.AudioContext||window.webkitAudioContext)();
          if (ctx.state === 'suspended') {
            ctx.resume();
          }
          previewCtx.current = ctx;
          const sched = makeEngine(ctx, b.style);
          const spb = 60 / b.bpm;
          let next = ctx.currentTime + 0.05;
          let count = 0;
          const loop = () => {
            while (next < ctx.currentTime + 0.12) {
              sched(next, count % 4, spb);
              next += spb;
              count++;
            }
            previewTimer.current = setTimeout(loop, 20);
          };
          loop();
          setPreviewIdx(idx);
        }
      }

      function addBeat() {
        const trimmed = name.trim();
        if (!trimmed) return;
        const clampedBpm = Math.max(40, Math.min(220, Math.round(bpm) || 90));
        setBeats(prev => [...prev, { name: trimmed, bpm: clampedBpm, style }]);
        setName(""); setBpm(95); setStyle("boom-bap");
      }

      function deleteBeat(idx) {
        if (beats.length <= 1) return;
        stopPreview();
        setBeats(prev => prev.filter((_,i)=>i!==idx));
        if (activeIdx >= idx && activeIdx > 0) setActiveIdx(activeIdx - 1);
        if (editIdx === idx) setEditIdx(null);
      }

      function openEdit(idx, b) {
        setEditIdx(idx);
        setEditName(b.name);
        setEditBpm(b.bpm);
      }

      function saveEdit(idx) {
        const trimmed = editName.trim();
        if (!trimmed) return;
        const clampedBpm = Math.max(40, Math.min(220, Math.round(editBpm) || 90));
        setBeats(prev => prev.map((b,i) => i===idx ? { ...b, name: trimmed, bpm: clampedBpm } : b));
        setEditIdx(null);
      }

      const ACCEPTED_AUDIO_EXTS = ['.m4a','.mp3','.wav','.ogg','.aac'];

      function handleFileSelect(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        const lower = file.name.toLowerCase();
        if (!ACCEPTED_AUDIO_EXTS.some(ext => lower.endsWith(ext))) {
          alert("Please select an audio file (MP3, WAV, M4A, OGG, or AAC)");
          return;
        }
        setUploadFile(file);
      }

      function uploadBeat() {
        if (!uploadFile || !uploadName.trim()) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const data = e.target?.result;
          if (!data) return;
          const beat = {
            name: uploadName.trim(),
            bpm: Math.max(40, Math.min(220, Math.round(uploadBpm) || 90)),
            style: "upload",
            audioData: data,
          };
          setBeats(prev => [...prev, beat]);
          setUploadName("");
          setUploadFile(null);
          setUploadBpm(95);
        };
        reader.readAsArrayBuffer(uploadFile);
      }

      // ─── Online library ─────────────────────────────────────────────────
      // Fetches a curated (or custom-URL) track's audio bytes and adds it to
      // the beat list, exactly like a local upload — the rest of the app
      // (playback, persistence, editing) treats it identically from here on.
      async function addLibraryBeat(item) {
        setLibraryError(null);
        setLibraryBusy(item.name);
        try {
          const res = await fetch(item.url);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const arrayBuffer = await res.arrayBuffer();
          setBeats(prev => [...prev, {
            name: item.name,
            bpm: item.bpm,
            style: "upload",
            url: item.url,
            credit: item.credit,
            audioData: arrayBuffer,
          }]);
        } catch (err) {
          console.error("Library fetch error:", err);
          setLibraryError("Couldn't load \"" + item.name + "\" — check your connection and try again.");
        } finally {
          setLibraryBusy(null);
        }
      }

      const alreadyAdded = (name) => beats.some(b => b.name === name);

      async function addCustomUrlBeat() {
        const url = customUrl.trim();
        const trimmedName = customName.trim();
        if (!url || !trimmedName) return;
        setCustomError(null);
        setCustomBusy(true);
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const arrayBuffer = await res.arrayBuffer();
          setBeats(prev => [...prev, {
            name: trimmedName,
            bpm: Math.max(40, Math.min(220, Math.round(customBpm) || 90)),
            style: "upload",
            url,
            credit: "Added from URL",
            audioData: arrayBuffer,
          }]);
          setCustomUrl(""); setCustomName(""); setCustomBpm(95);
        } catch (err) {
          console.error("Custom URL fetch error:", err);
          setCustomError("Couldn't load that link. Many sites block direct audio fetches (CORS) — Wikimedia Commons / archive.org direct file links tend to work best.");
        } finally {
          setCustomBusy(false);
        }
      }

      function previewUploadedBeat(beat, idx) {
        stopPreview();
        const play = (arrayBuffer) => {
          const ctx = new (window.AudioContext||window.webkitAudioContext)();
          if (ctx.state === 'suspended') ctx.resume();
          uploadAudioRef.current = ctx;
          // decodeAudioData detaches/neuters the ArrayBuffer it's given, so decoding
          // the stored buffer directly would leave it unusable next time (this is
          // exactly what caused "Cannot decode detached ArrayBuffer" after preview).
          // Always hand it a fresh copy via slice(0).
          ctx.decodeAudioData(arrayBuffer.slice(0), (buffer) => {
            const src = ctx.createBufferSource();
            src.buffer = buffer;
            src.connect(ctx.destination);
            src.start(0);
            src.onended = () => setPreviewIdx(null);
            setPreviewIdx(idx);
          }, (err) => {
            console.error("Decode error:", err);
            alert("Could not play this beat file");
          });
        };
        if (beat.audioData) {
          play(beat.audioData);
        } else if (beat.url) {
          // Beat survived a reload via its URL but audio bytes weren't kept —
          // fetch fresh, cache them on the beat, then preview.
          setLibraryBusy(beat.name);
          fetch(beat.url).then(res => res.arrayBuffer()).then(arrayBuffer => {
            setBeats(prev => prev.map(b => b === beat ? { ...b, audioData: arrayBuffer } : b));
            setLibraryBusy(null);
            play(arrayBuffer);
          }).catch(err => {
            console.error("Fetch error:", err);
            setLibraryBusy(null);
            alert("Could not load this beat's audio.");
          });
        }
      }

      return (
        <div style={{
          height:"100%",width:"100%",overflowY:"auto",
          background:"linear-gradient(155deg,#5e52e8 0%,#3d31c4 100%)",
          padding:"24px 16px 60px",
          fontFamily:"'Inter',sans-serif",
          animation:"fadeIn 0.35s ease both",
        }}>
          <style>{`
            @keyframes spin{to{transform:rotate(360deg)}}
          `}</style>
          <div style={{width:"100%",maxWidth:"min(94vw, 640px)",margin:"0 auto"}}>
            <BuilderHeader title="Custom Beats" onBack={() => { stopPreview(); onBack(); }} />

            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
              {beats.map((b,idx)=>(
                <div key={idx} style={{
                  display:"flex",flexDirection:"column",gap:10,
                  background: idx===activeIdx ? "rgba(249,115,22,0.16)" : "rgba(255,255,255,0.09)",
                  border: idx===activeIdx ? "1px solid rgba(249,115,22,0.5)" : "1px solid rgba(255,255,255,0.12)",
                  borderRadius:14,padding:"10px 12px",
                }}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <button onClick={()=>togglePreview(idx,b)} style={{
                      width:38,height:38,borderRadius:"50%",flexShrink:0,
                      background: previewIdx===idx ? "#F97316" : "rgba(255,255,255,0.14)",
                      color:"#fff",fontSize:15,
                      display:"flex",alignItems:"center",justifyContent:"center",
                    }}>
                      {libraryBusy===b.name ? "⋯" : previewIdx===idx ? "⏸" : "▶"}
                    </button>

                    <button onClick={()=>setActiveIdx(idx)} style={{
                      flex:1,textAlign:"left",background:"none",minWidth:0,
                    }}>
                      <div style={{fontFamily:"'Nunito'",fontWeight:800,fontSize:15,color:"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{b.name}</div>
                      <div style={{fontSize:11,color:"rgba(255,255,255,0.45)"}}>
                        {b.bpm} BPM · {b.credit ? "Online" : (BEAT_STYLE_LABELS[b.style]||b.style)}
                      </div>
                    </button>

                    {idx===activeIdx && (
                      <span style={{fontSize:10,fontWeight:800,color:"#F97316",marginRight:2,flexShrink:0}}>SELECTED</span>
                    )}

                    <button onClick={()=>openEdit(idx,b)} style={{
                      width:30,height:30,borderRadius:"50%",flexShrink:0,
                      background:"rgba(255,255,255,0.08)",color:"#0EA5E9",fontSize:13,
                      display:"flex",alignItems:"center",justifyContent:"center",
                    }}>✎</button>

                    <button onClick={()=>deleteBeat(idx)} disabled={beats.length<=1} style={{
                      width:30,height:30,borderRadius:"50%",flexShrink:0,
                      background:"rgba(255,255,255,0.08)",
                      color: beats.length<=1 ? "rgba(255,255,255,0.2)" : "#fca5a5",
                      fontSize:14,
                      display:"flex",alignItems:"center",justifyContent:"center",
                      opacity: beats.length<=1 ? 0.5 : 1,
                    }}>✕</button>
                  </div>

                  {b.credit && (
                    <div style={{fontSize:10,color:"rgba(255,255,255,0.32)",paddingLeft:48}}>{b.credit}</div>
                  )}

                  {editIdx === idx && (
                    <div style={{
                      background:"rgba(0,0,0,0.2)",borderRadius:10,padding:12,
                      display:"flex",flexDirection:"column",gap:10,animation:"fadeIn 0.15s ease",
                    }}>
                      <div>
                        <div style={{fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:5}}>Name</div>
                        <input value={editName} onChange={e=>setEditName(e.target.value)} style={{
                          width:"100%",padding:"8px 10px",borderRadius:8,
                          background:"rgba(0,0,0,0.25)",border:"1px solid rgba(255,255,255,0.15)",
                          color:"#fff",fontSize:14,fontFamily:"inherit",
                        }}/>
                      </div>
                      <div>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                          <span style={{fontSize:10,color:"rgba(255,255,255,0.45)"}}>Tempo</span>
                          <span style={{fontSize:11,fontWeight:700,color:"#0EA5E9"}}>{editBpm} BPM</span>
                        </div>
                        <input type="range" min="40" max="220" step="1" value={editBpm}
                          onChange={e=>setEditBpm(parseInt(e.target.value,10))}
                          style={{width:"100%",cursor:"pointer"}}/>
                      </div>
                      <div style={{display:"flex",gap:8}}>
                        <button onClick={()=>setEditIdx(null)} style={{
                          flex:1,padding:"9px",borderRadius:10,
                          background:"rgba(255,255,255,0.1)",color:"rgba(255,255,255,0.7)",
                          fontWeight:700,fontSize:12,
                        }}>Cancel</button>
                        <button onClick={()=>saveEdit(idx)} disabled={!editName.trim()} style={{
                          flex:1,padding:"9px",borderRadius:10,
                          background: editName.trim() ? "#0EA5E9" : "rgba(255,255,255,0.1)",
                          color: editName.trim() ? "#111" : "rgba(255,255,255,0.35)",
                          fontWeight:800,fontSize:12,
                        }}>Save</button>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>

            {/* Online beat library */}
            <div style={{
              background:"rgba(255,255,255,0.09)",border:"1px solid rgba(255,255,255,0.12)",
              borderRadius:18,padding:16,marginBottom:16,
            }}>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:1.5,color:"rgba(255,255,255,0.5)",marginBottom:6}}>ONLINE BEAT LIBRARY</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:14,lineHeight:1.4}}>
                Free, rights-cleared instrumentals — added straight to your beat list, no download needed.
              </div>

              <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
                {QUICK_PICK_BEATS.map(item=>{
                  const added = alreadyAdded(item.name);
                  const busy = libraryBusy===item.name;
                  return (
                    <div key={item.name} style={{
                      display:"flex",alignItems:"center",gap:10,
                      background:"rgba(0,0,0,0.15)",borderRadius:12,padding:"10px 12px",
                    }}>
                      <div style={{
                        width:36,height:36,borderRadius:8,flexShrink:0,
                        background:"linear-gradient(135deg,#0EA5E9,#22C55E)",
                        display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,
                      }}>🌐</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontFamily:"'Nunito'",fontWeight:800,fontSize:13,color:"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.name}</div>
                        <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>{item.bpm} BPM · {item.credit}</div>
                      </div>
                      <button onClick={()=>addLibraryBeat(item)} disabled={added||busy} style={{
                        flexShrink:0,padding:"8px 14px",borderRadius:10,
                        background: added ? "rgba(34,197,94,0.2)" : busy ? "rgba(255,255,255,0.1)" : "#0EA5E9",
                        color: added ? "#22C55E" : busy ? "rgba(255,255,255,0.5)" : "#111",
                        fontWeight:800,fontSize:12,
                        display:"flex",alignItems:"center",gap:6,
                      }}>
                        {busy && (
                          <span style={{
                            width:11,height:11,borderRadius:"50%",
                            border:"2px solid rgba(0,0,0,0.25)",borderTopColor:"rgba(255,255,255,0.7)",
                            animation:"spin 0.7s linear infinite",display:"inline-block",
                          }}/>
                        )}
                        {added ? "Added ✓" : busy ? "Loading" : "+ Add"}
                      </button>
                    </div>
                  );
                })}
              </div>

              {libraryError && (
                <div style={{fontSize:11,color:"#fca5a5",marginBottom:12}}>{libraryError}</div>
              )}

              <div style={{borderTop:"1px solid rgba(255,255,255,0.1)",paddingTop:14}}>
                <div style={{fontSize:10,fontWeight:700,letterSpacing:1.2,color:"rgba(255,255,255,0.4)",marginBottom:10}}>OR ADD FROM A DIRECT AUDIO URL</div>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  <input value={customName} onChange={e=>setCustomName(e.target.value)} placeholder="Beat name"
                    style={{
                      width:"100%",padding:"9px 12px",borderRadius:10,
                      background:"rgba(0,0,0,0.2)",border:"1px solid rgba(255,255,255,0.15)",
                      color:"#fff",fontSize:13,fontFamily:"inherit",
                    }}/>
                  <input value={customUrl} onChange={e=>setCustomUrl(e.target.value)} placeholder="https://... direct link to an mp3/ogg/wav"
                    style={{
                      width:"100%",padding:"9px 12px",borderRadius:10,
                      background:"rgba(0,0,0,0.2)",border:"1px solid rgba(255,255,255,0.15)",
                      color:"#fff",fontSize:13,fontFamily:"inherit",
                    }}/>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{fontSize:11,color:"rgba(255,255,255,0.4)",flexShrink:0}}>Tempo</span>
                    <input type="range" min="40" max="220" step="1" value={customBpm}
                      onChange={e=>setCustomBpm(parseInt(e.target.value,10))}
                      style={{flex:1,cursor:"pointer"}}/>
                    <span style={{fontSize:12,fontWeight:700,color:"#0EA5E9",width:52,textAlign:"right",flexShrink:0}}>{customBpm} BPM</span>
                  </div>
                  <button onClick={addCustomUrlBeat} disabled={!customUrl.trim()||!customName.trim()||customBusy} style={{
                    width:"100%",padding:"11px",borderRadius:10,
                    background: (customUrl.trim()&&customName.trim()&&!customBusy) ? "#0EA5E9" : "rgba(255,255,255,0.1)",
                    color: (customUrl.trim()&&customName.trim()&&!customBusy) ? "#111" : "rgba(255,255,255,0.35)",
                    fontFamily:"'Nunito'",fontWeight:900,fontSize:14,
                  }}>{customBusy ? "Loading…" : "+ Add From URL"}</button>
                  {customError && (
                    <div style={{fontSize:11,color:"#fca5a5"}}>{customError}</div>
                  )}
                </div>
              </div>
            </div>

            <div style={{
              background:"rgba(255,255,255,0.09)",border:"1px solid rgba(255,255,255,0.12)",
              borderRadius:18,padding:16,
            }}>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:1.5,color:"rgba(255,255,255,0.5)",marginBottom:14}}>ADD A SYNTHESIZED BEAT</div>

              <div style={{marginBottom:12}}>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.45)",marginBottom:6}}>Name</div>
                <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Drill, West Coast..."
                  style={{
                    width:"100%",padding:"10px 12px",borderRadius:10,
                    background:"rgba(0,0,0,0.2)",border:"1px solid rgba(255,255,255,0.15)",
                    color:"#fff",fontSize:14,fontFamily:"inherit",
                  }}/>
              </div>

              <div style={{marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                  <span style={{fontSize:11,color:"rgba(255,255,255,0.45)"}}>Tempo</span>
                  <span style={{fontSize:12,fontWeight:700,color:"#0EA5E9"}}>{bpm} BPM</span>
                </div>
                <input type="range" min="40" max="220" step="1" value={bpm}
                  onChange={e=>setBpm(parseInt(e.target.value,10))}
                  style={{width:"100%",cursor:"pointer"}}/>
              </div>

              <div style={{marginBottom:16}}>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.45)",marginBottom:6}}>Drum Style</div>
                <div style={{display:"flex",gap:6}}>
                  {BEAT_STYLES.map(s=>(
                    <button key={s} onClick={()=>setStyle(s)} style={{
                      flex:1,padding:"9px 4px",borderRadius:10,
                      background: style===s ? "#fff" : "rgba(255,255,255,0.08)",
                      color:      style===s ? "#3d31c4" : "rgba(255,255,255,0.6)",
                      fontSize:12,fontWeight:800,
                    }}>{BEAT_STYLE_LABELS[s]}</button>
                  ))}
                </div>
              </div>

              <button onClick={addBeat} disabled={!name.trim()} style={{
                width:"100%",padding:"13px",borderRadius:12,
                background: name.trim() ? "#F97316" : "rgba(255,255,255,0.1)",
                color: name.trim() ? "#fff" : "rgba(255,255,255,0.35)",
                fontFamily:"'Nunito'",fontWeight:900,fontSize:15,
              }}>+ Add Beat</button>
            </div>

            {/* Upload beat section */}
            <div style={{
              background:"rgba(255,255,255,0.09)",border:"1px solid rgba(255,255,255,0.12)",
              borderRadius:18,padding:16,marginTop:16,
            }}>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:1.5,color:"rgba(255,255,255,0.5)",marginBottom:14}}>UPLOAD BEAT (MP3, WAV, M4A...)</div>

              <a href="https://pixabay.com/music/search/genre/hip-hop-rap/" target="_blank" rel="noopener noreferrer" style={{
                display:"flex",alignItems:"center",gap:10,textDecoration:"none",
                background:"rgba(14,165,233,0.14)",border:"1px solid rgba(14,165,233,0.35)",
                borderRadius:12,padding:"11px 14px",marginBottom:16,
              }}>
                <span style={{fontSize:18}}>🔗</span>
                <div>
                  <div style={{fontSize:13,fontWeight:800,color:"#0EA5E9"}}>Browse free beats on Pixabay ↗</div>
                  <div style={{fontSize:11,color:"rgba(255,255,255,0.45)"}}>No sign-up — download an MP3, then upload it below</div>
                </div>
              </a>

              <div style={{marginBottom:12}}>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.45)",marginBottom:6}}>Beat Name</div>
                <input value={uploadName} onChange={e=>setUploadName(e.target.value)} placeholder="e.g. My Custom Beat..."
                  style={{
                    width:"100%",padding:"10px 12px",borderRadius:10,
                    background:"rgba(0,0,0,0.2)",border:"1px solid rgba(255,255,255,0.15)",
                    color:"#fff",fontSize:14,fontFamily:"inherit",
                  }}/>
              </div>

              <div style={{marginBottom:12}}>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.45)",marginBottom:6}}>
                  {uploadFile ? "File: " + uploadFile.name : "Select an audio file"}
                </div>
                <input type="file" accept=".m4a,.mp3,.wav,.ogg,.aac,audio/*" onChange={handleFileSelect}
                  style={{
                    width:"100%",padding:"10px 12px",borderRadius:10,
                    background:"rgba(0,0,0,0.2)",border:"1px solid rgba(255,255,255,0.15)",
                    color:"#fff",fontSize:14,fontFamily:"inherit",
                  }}/>
              </div>

              <div style={{marginBottom:16}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                  <span style={{fontSize:11,color:"rgba(255,255,255,0.45)"}}>Tempo (Optional)</span>
                  <span style={{fontSize:12,fontWeight:700,color:"#0EA5E9"}}>{uploadBpm} BPM</span>
                </div>
                <input type="range" min="40" max="220" step="1" value={uploadBpm}
                  onChange={e=>setUploadBpm(parseInt(e.target.value,10))}
                  style={{width:"100%",cursor:"pointer"}}/>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",marginTop:4}}>Set to 0 to ignore BPM</div>
              </div>

              <button onClick={uploadBeat} disabled={!uploadFile || !uploadName.trim()} style={{
                width:"100%",padding:"13px",borderRadius:12,
                background: (uploadFile && uploadName.trim()) ? "#0EA5E9" : "rgba(255,255,255,0.1)",
                color: (uploadFile && uploadName.trim()) ? "#111" : "rgba(255,255,255,0.35)",
                fontFamily:"'Nunito'",fontWeight:900,fontSize:15,
              }}>+ Upload Beat</button>
            </div>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // WORD BUILDER
    // ═══════════════════════════════════════════════════════════════════════════════
    function WordBuilder({ wordSets, setWordSets, onBack }) {
      const [group, setGroup] = useState("A");
      const [sylKey, setSylKey] = useState("1");
      const [bulk, setBulk] = useState("");

      const poolKey = group + sylKey;
      const words = wordSets[poolKey] && wordSets[poolKey].length ? wordSets[poolKey] : (POOLS[poolKey]||[]);

      function removeWord(w) {
        setWordSets(prev => ({ ...prev, [poolKey]: (prev[poolKey]||POOLS[poolKey]||[]).filter(x=>x!==w) }));
      }

      function addWords() {
        const incoming = bulk
          .split(/[\n,]/)
          .map(w=>w.trim().toLowerCase())
          .filter(Boolean);
        if (!incoming.length) return;
        setWordSets(prev => {
          const current = prev[poolKey] && prev[poolKey].length ? prev[poolKey] : (POOLS[poolKey]||[]);
          const merged = [...new Set([...current, ...incoming])];
          return { ...prev, [poolKey]: merged };
        });
        setBulk("");
      }

      function resetPool() {
        setWordSets(prev => ({ ...prev, [poolKey]: [...(POOLS[poolKey]||[])] }));
      }

      return (
        <div style={{
          height:"100%",width:"100%",overflowY:"auto",
          background:"linear-gradient(155deg,#5e52e8 0%,#3d31c4 100%)",
          padding:"24px 16px 60px",
          fontFamily:"'Inter',sans-serif",
          animation:"fadeIn 0.35s ease both",
        }}>
          <div style={{width:"100%",maxWidth:"min(94vw, 640px)",margin:"0 auto"}}>
            <BuilderHeader title="Word Sets" onBack={onBack} />

            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
              {WORD_GROUPS.map(g=>(
                <button key={g} onClick={()=>setGroup(g)} style={{
                  flexBasis:"calc(20% - 5px)",flexGrow:1,padding:"9px 2px",borderRadius:10,
                  background: group===g ? GROUP_COLORS[g] : "rgba(255,255,255,0.09)",
                  color:      group===g ? "#111" : "rgba(255,255,255,0.6)",
                  fontFamily:"'Nunito'",fontWeight:900,fontSize:12,
                  border: group===g ? "none" : "1px solid rgba(255,255,255,0.12)",
                }}>{g}</button>
              ))}
            </div>

            <div style={{display:"flex",gap:6,marginBottom:16}}>
              {[["1","1 Syllable"],["2","2 Syllables"],["3","3 Syllables"]].map(([k,label])=>(
                <button key={k} onClick={()=>setSylKey(k)} style={{
                  flex:1,padding:"8px 2px",borderRadius:20,
                  background: sylKey===k ? "#fff" : "rgba(255,255,255,0.1)",
                  color:      sylKey===k ? "#3d31c4" : "rgba(255,255,255,0.65)",
                  fontSize:11,fontWeight:800,
                }}>{label}</button>
              ))}
            </div>

            <div style={{
              background:"rgba(255,255,255,0.09)",border:"1px solid rgba(255,255,255,0.12)",
              borderRadius:18,padding:16,marginBottom:16,
            }}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <span style={{fontSize:11,fontWeight:700,letterSpacing:1.5,color:"rgba(255,255,255,0.5)"}}>
                  {words.length} WORDS
                </span>
                <button onClick={resetPool} style={{
                  background:"none",color:"rgba(255,255,255,0.4)",fontSize:11,fontWeight:700,
                  textDecoration:"underline",
                }}>Reset to default</button>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6,maxHeight:220,overflowY:"auto"}}>
                {words.map(w=>(
                  <span key={w} style={{
                    display:"flex",alignItems:"center",gap:6,
                    background: GROUP_COLORS[group]+"33",
                    border:`1px solid ${GROUP_COLORS[group]}66`,
                    color:"#fff",borderRadius:20,padding:"5px 6px 5px 12px",
                    fontSize:13,fontWeight:600,
                  }}>
                    {w}
                    <button onClick={()=>removeWord(w)} style={{
                      width:18,height:18,borderRadius:"50%",
                      background:"rgba(0,0,0,0.25)",color:"#fff",fontSize:10,
                      display:"flex",alignItems:"center",justifyContent:"center",
                    }}>✕</button>
                  </span>
                ))}
                {!words.length && (
                  <span style={{fontSize:12,color:"rgba(255,255,255,0.35)"}}>No words yet — add some below.</span>
                )}
              </div>
            </div>

            <div style={{
              background:"rgba(255,255,255,0.09)",border:"1px solid rgba(255,255,255,0.12)",
              borderRadius:18,padding:16,
            }}>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:1.5,color:"rgba(255,255,255,0.5)",marginBottom:10}}>
                ADD WORDS TO GROUP {group} · {SYLLABLE_OPTS[parseInt(sylKey,10)-1]}
              </div>
              <textarea
                value={bulk}
                onChange={e=>setBulk(e.target.value)}
                placeholder="Paste or type words — separate with commas or new lines"
                rows={4}
                style={{
                  width:"100%",padding:"10px 12px",borderRadius:10,
                  background:"rgba(0,0,0,0.2)",border:"1px solid rgba(255,255,255,0.15)",
                  color:"#fff",fontSize:14,fontFamily:"inherit",resize:"vertical",marginBottom:10,
                }}
              />
              <button onClick={addWords} disabled={!bulk.trim()} style={{
                width:"100%",padding:"13px",borderRadius:12,
                background: bulk.trim() ? GROUP_COLORS[group] : "rgba(255,255,255,0.1)",
                color: bulk.trim() ? "#111" : "rgba(255,255,255,0.35)",
                fontFamily:"'Nunito'",fontWeight:900,fontSize:15,
              }}>+ Add Words</button>
            </div>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // GAME
    // ═══════════════════════════════════════════════════════════════════════════════
    function GameScreen({ bars,currentBar,beatInBar,beatFrac,isPlaying,justFinished,
      onPlay,onPause,onBack,beatName,bpm,scrollRef,rowRefs }) {
      return (
        <div style={{
          height:"100%",width:"100%",
          background:"linear-gradient(155deg,#5e52e8 0%,#3d31c4 100%)",
          display:"flex",flexDirection:"column",overflow:"hidden",
          fontFamily:"'Inter',sans-serif",
        }}>
          <div ref={scrollRef} style={{flex:1,overflowY:"scroll",overflowX:"hidden",paddingTop:16}}>
            <div style={{width:"100%",maxWidth:"min(94vw, 900px)",margin:"0 auto"}}>
              {bars.map((bar,idx)=>{
                const isCur  = idx===currentBar;
                const isPast = idx<currentBar;
                const dist   = currentBar-idx;
                const opacity= isPast ? Math.max(0.15, 1-dist*0.13) : 1;
                return (
                  <BarRow
                    key={idx}
                    refCb={el=>{ if(el) rowRefs.current[idx]=el; }}
                    bar={bar}
                    isCurrent={isCur}
                    isPast={isPast}
                    opacity={opacity}
                    isPlaying={isPlaying}
                    beatInBar={beatInBar}
                    beatFrac={beatFrac}
                  />
                );
              })}
              <div style={{height:300}}/>
            </div>
          </div>

          <BottomPanel
            isPlaying={isPlaying} justFinished={justFinished} onPlay={onPlay} onPause={onPause} onBack={onBack}
            beatName={beatName} bpm={bpm}
            currentBar={currentBar} totalBars={bars.length}
          />
        </div>
      );
    }

    // The row holds 4 equal-width blocks in a flex row with small gaps between
    // them — the tick marks and the ball both need to land on each block's
    // actual center (12.5%, 37.5%, 62.5%, 87.5%), not on evenly-spaced points
    // across the row's full 0–100% span, which is what caused the previous
    // mismatch between the ticks/ball and the blocks they're meant to mark.
    const TICK_POSITIONS = [12.5, 37.5, 62.5, 87.5];

    function BarRow({ refCb, bar, isCurrent, isPast, opacity, isPlaying, beatInBar, beatFrac }) {
      const color = bar.group ? GROUP_COLORS[bar.group] : null;
      const bounceY     = Math.sin(beatFrac * Math.PI);
      const BALL_R      = 17;
      const rowPixH     = isCurrent ? ROW_H + 10 : ROW_H;
      const ballBottom  = 10 + bounceY * (rowPixH * 0.55);
      // Ball glides from the current beat's tick toward the next one, landing
      // exactly on each tick right as that beat starts (beatFrac === 0).
      const fromPct     = TICK_POSITIONS[beatInBar];
      const toPct       = beatInBar < 3 ? TICK_POSITIONS[beatInBar + 1] : 97;
      const ballLeftPct = fromPct + (toPct - fromPct) * beatFrac;

      return (
        <div
          ref={refCb}
          style={{
            display:"flex",alignItems:"center",
            padding:"0 8px",marginBottom:5,
            opacity,
            transition:"opacity 0.45s ease",
          }}
        >
          <div style={{
            width:30,flexShrink:0,textAlign:"right",paddingRight:6,
            fontSize:11,color:"rgba(255,255,255,0.28)",fontWeight:600,
          }}>{bar.barNum}</div>

          <div style={{
            flex:1,
            height:rowPixH,
            position:"relative",
            display:"flex",gap:5,alignItems:"stretch",
            borderRadius:12,
            outline: isCurrent
              ? "3px solid rgba(255,255,255,0.9)"
              : "3px solid transparent",
            outlineOffset:2,
            boxShadow: isCurrent
              ? "0 0 0 6px rgba(255,255,255,0.13), 0 10px 36px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.1)"
              : "none",
            transition:"all 0.35s cubic-bezier(.4,0,.2,1)",
            overflow:"visible",
          }}>
            {[0,1,2].map(c=>(
              <div key={c} style={{
                flex:1,
                background: isCurrent
                  ? "rgba(255,255,255,0.22)"
                  : isPast
                    ? "rgba(255,255,255,0.05)"
                    : "rgba(255,255,255,0.10)",
                borderRadius:10,
                transition:"background 0.3s",
              }}/>
            ))}

            <div style={{
              flex:1,
              background: color
                ? (isCurrent ? color : isPast ? color+"77" : color+"aa")
                : (isCurrent ? "rgba(255,255,255,0.2)" : isPast ? "rgba(255,255,255,0.05)" : "rgba(255,255,255,0.1)"),
              borderRadius:10,
              display:"flex",alignItems:"center",justifyContent:"center",
              fontFamily:"'Nunito'",fontWeight:900,
              fontSize: !bar.word ? 14 : bar.word.length>7 ? 15 : bar.word.length>5 ? 19 : 23,
              color: color ? (isCurrent?"#111":"#222") : "rgba(255,255,255,0.2)",
              transition:"all 0.3s",
              userSelect:"none",
            }}>
              {bar.word||""}
            </div>

            {isCurrent && (
              <>
                <div style={{
                  position:"absolute",
                  bottom:8,left:"3%",right:"3%",
                  height:2,
                  background:"rgba(255,255,255,0.25)",
                  borderRadius:1,
                  pointerEvents:"none",
                }}/>
                {[0,1,2,3].map(i=>{
                  const xPct = TICK_POSITIONS[i];
                  const isActive = i===beatInBar;
                  return (
                    <div key={i} style={{
                      position:"absolute",
                      bottom:4,
                      left:`${xPct}%`,
                      transform:"translateX(-50%)",
                      width:3,height:16,
                      background: isActive&&isPlaying ? "#fff" : "rgba(255,255,255,0.3)",
                      borderRadius:2,
                      boxShadow: isActive&&isPlaying ? "0 0 8px #fff" : "none",
                      transition:"background 0.05s",
                      pointerEvents:"none",
                    }}/>
                  );
                })}
                {isPlaying && (
                  <>
                    <div style={{
                      position:"absolute",
                      bottom:7,
                      left:`${ballLeftPct}%`,
                      transform:"translateX(-50%)",
                      width:BALL_R*1.5,height:6,
                      borderRadius:"50%",
                      background:"rgba(0,0,0,0.35)",
                      filter:"blur(3px)",
                      pointerEvents:"none",
                    }}/>
                    <div style={{
                      position:"absolute",
                      bottom:ballBottom,
                      left:`${ballLeftPct}%`,
                      transform:"translateX(-50%)",
                      width:BALL_R*2,height:BALL_R*2,
                      borderRadius:"50%",
                      background:"radial-gradient(circle at 33% 28%, #FFE97A, #F5AC26 52%, #C87E0A)",
                      boxShadow:"0 4px 18px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,255,255,0.2), 0 0 20px rgba(245,172,38,0.7)",
                      pointerEvents:"none",
                      zIndex:20,
                    }}/>
                  </>
                )}
              </>
            )}
          </div>

          <div style={{
            width:30,flexShrink:0,paddingLeft:6,
            fontSize:11,color:"rgba(255,255,255,0.28)",fontWeight:600,
          }}>{bar.barNum}</div>
        </div>
      );
    }

    function BottomPanel({ isPlaying,justFinished,onPlay,onPause,onBack,beatName,bpm,currentBar,totalBars }) {
      return (
        <div style={{
          background:"rgba(12,8,50,0.95)",
          backdropFilter:"blur(16px)",
          borderTop:"1px solid rgba(255,255,255,0.08)",
          padding:"14px 16px 22px",flexShrink:0,
        }}>
          <div style={{width:"100%",maxWidth:"min(94vw, 900px)",margin:"0 auto"}}>
          <div style={{
            textAlign:"center",fontSize:10,fontWeight:700,
            letterSpacing:2,color: justFinished ? "#22C55E" : "rgba(255,255,255,0.38)",
            marginBottom:3,textTransform:"uppercase",
          }}>
            {isPlaying
              ? `Bar ${currentBar+1} of ${totalBars}`
              : justFinished
                ? "🎉 FREESTYLE COMPLETE — WORDS SHUFFLED"
                : "GAME PAUSED"}
          </div>
          {!isPlaying && !justFinished && (
            <div style={{textAlign:"center",fontSize:11,color:"rgba(255,255,255,0.28)",marginBottom:10}}>
              Swipe Up &amp; Down On Screen to Scroll
            </div>
          )}
          {!isPlaying && justFinished && (
            <div style={{textAlign:"center",fontSize:11,color:"rgba(255,255,255,0.28)",marginBottom:10}}>
              Fresh words are ready — hit play to go again
            </div>
          )}

          <div style={{display:"flex",gap:8,justifyContent:"center",marginBottom:12}}>
            <button onClick={onBack} style={{
              background:"rgba(255,255,255,0.09)",color:"#fff",
              borderRadius:22,padding:"9px 18px",fontWeight:700,fontSize:13,
              border:"1px solid rgba(255,255,255,0.14)",
            }}>‹ BACK</button>

            <button onClick={isPlaying?onPause:onPlay} style={{
              background: isPlaying?"rgba(255,255,255,0.12)":"#F97316",
              color:"#fff",borderRadius:22,padding:"9px 26px",
              fontFamily:"'Nunito'",fontWeight:900,fontSize:15,
              border: isPlaying?"1px solid rgba(255,255,255,0.18)":"none",
              boxShadow: isPlaying?"none":"0 3px 18px rgba(249,115,22,0.55)",
              transition:"all 0.15s",
            }}>
              {isPlaying?"⏸ Pause":justFinished?"▶ Play Again":"▶ Play Beat"}
            </button>

            <button style={{
              background:"rgba(255,255,255,0.09)",color:"#fff",
              borderRadius:22,padding:"9px 18px",fontWeight:700,fontSize:13,
              border:"1px solid rgba(255,255,255,0.14)",
            }}>FWD ›</button>
          </div>

          <div style={{
            display:"flex",alignItems:"center",gap:12,
            background:"rgba(255,255,255,0.06)",borderRadius:12,padding:"10px 14px",
          }}>
            <div style={{
              width:44,height:44,borderRadius:8,flexShrink:0,
              background:"linear-gradient(135deg,#7c3aed,#2563eb)",
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,
            }}>🎵</div>
            <div style={{flex:1}}>
              <div style={{fontFamily:"'Nunito'",fontWeight:800,fontSize:14,color:"#fff"}}>{beatName} Beat</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.35)"}}>
                {bpm} BPM
              </div>
            </div>
            <div style={{width:64,display:"flex",flexDirection:"column",gap:4}}>
              <div style={{height:3,background:"rgba(255,255,255,0.1)",borderRadius:2,overflow:"hidden"}}>
                <div style={{
                  height:"100%",
                  width:`${Math.round((currentBar/Math.max(1,totalBars-1))*100)}%`,
                  background:"#EAB308",borderRadius:2,transition:"width 0.5s",
                }}/>
              </div>
            </div>
          </div>

          <div style={{
            textAlign:"center",marginTop:10,
            fontFamily:"'Nunito'",fontWeight:900,fontSize:12,
            color:"rgba(255,255,255,0.18)",
          }}>created by ryx, higgis</div>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // RENDER
    // ═══════════════════════════════════════════════════════════════════════════════
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<RhymeGame />);
  </script>
</body>
</html>
