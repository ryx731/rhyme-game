    async function resolveCommonsFileUrl(filename) {
      const api = "https://commons.wikimedia.org/w/api.php?action=query&titles="
        + encodeURIComponent("File:" + filename)
        + "&prop=imageinfo&iiprop=url&format=json&origin=*";
      const res = await fetch(api);
      if (!res.ok) throw new Error("Wikimedia API HTTP " + res.status);
      const data = await res.json();
      const pages = data.query && data.query.pages;
      const page = pages && Object.values(pages)[0];
      const url = page && page.imageinfo && page.imageinfo[0] && page.imageinfo[0].url;
      if (!url) throw new Error("Could not resolve file URL from Wikimedia API");
      return url;
    }

    async function resolveDirectAudioUrl(url) {
      const specialFilePath = url.match(/commons\.wikimedia\.org\/wiki\/Special:FilePath\/([^?#]+)/);

      const filename = specialFilePath ? specialFilePath[1] : filePage ? filePage[1] : null;
      if (filename) return await resolveCommonsFileUrl(decodeURIComponent(filename));
      return url;

    function getPool(grp, syl, sets) {
      if (!grp) return [];
      const pools = sets || POOLS;
      const pick = (k) => (pools[k] && pools[k].length ? pools[k] : POOLS[k]) || [];
      if (syl==="1 Syllable") return pick(grp+"1");
      if (syl==="2 Syllables") return pick(grp+"2");
      if (syl==="3 Syllables") return pick(grp+"3");
      return [...pick(grp+"1"),...pick(grp+"2"),...pick(grp+"3")];
    }

    function shuffle(arr){ 
      const a=[...arr]; 
      for(let i=a.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      } 
      return a; 
    }

    // Splits a scheme's repeating pattern (applied across numBars) into
    // consecutive "runs" — maximal stretches of bars that share the same
    // slot letter, back to back. For AABB across 8 bars that's:
    //   [A,A] [B,B] [A,A] [B,B]  ->  4 runs
    // This is the actual unit a rhyme family gets assigned to: every run
    // gets its own fresh random family, so bars within a run genuinely
    // rhyme (same family), and the *next* run of that same letter (e.g. the
    // second "AA" couplet) gets a different family than the first, which is
    // what makes a rhyme scheme like AABB actually sound like AABB-CCDD-...
    // instead of the same two families repeating for the whole session.
    function splitIntoRuns(scheme, numBars) {
      const runs = [];
      let i = 0;
      while (i < numBars) {
        const slot = scheme.pattern[i % scheme.pattern.length];
        let len = 1;
        while (
          i + len < numBars &&
          scheme.pattern[(i + len) % scheme.pattern.length] === slot
        ) {
          len++;
        }
        runs.push({ slot, start: i, length: len });
        i += len;
      }
      return runs;
    }

    // Assigns each run a random rhyme family, never repeating the family
    // used by the immediately preceding run (of any slot) so consecutive
    // couplets don't accidentally land on the same sound, and cycling back
    // through a freshly shuffled order of all 20 families once exhausted so
    // long sessions still get full variety rather than repeating in a fixed
    // loop.
    function assignRunFamilies(runs) {
      const families = [];
      let shuffled = shuffle(WORD_GROUPS);
      let cursor = 0;
      let prevFamily = null;
      runs.forEach(() => {
        if (cursor >= shuffled.length) {
          shuffled = shuffle(WORD_GROUPS);
          cursor = 0;
        }
        let fam = shuffled[cursor++];
        // Avoid repeating the previous run's family back-to-back (only
        // relevant right at a reshuffle boundary); just pull the next one.
        if (fam === prevFamily && cursor < shuffled.length) {
          fam = shuffled[cursor++];
        }
        prevFamily = fam;
        families.push(fam);
      });
      return families;
    }

    function buildBars(scheme, syl, numBars, sets) {
      const runs = splitIntoRuns(scheme, numBars);
      const runFamilies = assignRunFamilies(runs);
      const bars = new Array(numBars).fill(null);

      // When syllable mode is "All 1+2+3", pick ONE concrete syllable count
      // (1, 2, or 3) per rhyming run-PAIR rather than letting each run — or
      // even each word within a run — land on a different syllable count
      // independently. Real freestyle/rhyme-game apps keep each "round" of
      // lines metrically consistent (matching syllable count across the A
      // and B lines that go together), which this mirrors: every two
      // consecutive rhyming runs (e.g. an AA couplet followed by a BB
      // couplet) share one syllable count, then the next pair of runs rolls
      // a fresh one. For a fixed syllable mode ("1 Syllable" etc.) this has
      // no effect since every line already uses that same count.
      const FIXED_SYL_COUNTS = ["1 Syllable", "2 Syllables", "3 Syllables"];
      const pairSylChoice = {};
      function syllableCountForRun(runIdx) {
        if (syl !== "All 1+2+3") return syl;
        const pairIdx = Math.floor(runIdx / 2);
        if (!(pairIdx in pairSylChoice)) {
          pairSylChoice[pairIdx] = FIXED_SYL_COUNTS[Math.floor(Math.random() * FIXED_SYL_COUNTS.length)];
        }
        return pairSylChoice[pairIdx];
      }

      runs.forEach((run, idx) => {
        const slot = run.slot;
        if (!slot) {
          // Non-rhyming (null/"X") slots — leave blank.
          for (let k = 0; k < run.length; k++) {
            bars[run.start + k] = { barNum: run.start + k + 1, word: null, group: null, slot: null };
          }
          return;
        }
        const family = runFamilies[idx];
        const effectiveSyl = syllableCountForRun(idx);
        // Pull enough distinct words from this one family to fill the run
        // (so e.g. an AABB couplet's two "A" bars share a family but aren't
        // literally the same word), falling back to repeating words only if
        // the family's pool is smaller than the run length. Using
        // `effectiveSyl` (a single concrete syllable count, resolved above)
        // instead of the raw `syl` setting means both words in the run —
        // and, via pairSylChoice, the paired run of the other letter —
        // always come from the same syllable-count pool.
        const pool = shuffle(getPool(family, effectiveSyl, sets));
        for (let k = 0; k < run.length; k++) {
          const word = pool.length ? pool[k % pool.length] : null;
          // `group` keeps the actual rhyme family (used by the Word Sets
          // editor's 20-color palette); `slot` keeps the scheme letter
          // (A/B/...) which the in-game bars are colored by instead, so
          // every "A" line reads as one color and every "B" line as another
          // regardless of which of the 20 families it happens to be pulling
          // words from that round.
          bars[run.start + k] = { barNum: run.start + k + 1, word, group: word ? family : null, slot: word ? slot : null };
        }
      });

      return bars;
    }

    // ─── BPM Detection ────────────────────────────────────────────────────────────
    function detectBPM(audioBuffer) {
      try {
        const sampleRate = audioBuffer.sampleRate;
        const raw = audioBuffer.getChannelData(0);
        const analyzeSamples = Math.min(raw.length, sampleRate * 45);
        const chunkSize = Math.max(1, Math.floor(sampleRate / 200));
        const numChunks = Math.floor(analyzeSamples / chunkSize);
        if (numChunks < 20) return null;
        const envelope = new Float32Array(numChunks);
        for (let i = 0; i < numChunks; i++) {
          let sum = 0;
          const start = i * chunkSize;
          for (let j = 0; j < chunkSize; j++) {
            const v = raw[start + j];
            sum += v * v;
          }
          envelope[i] = Math.sqrt(sum / chunkSize);
        }
        const novelty = new Float32Array(numChunks);
        for (let i = 1; i < numChunks; i++) {
          const d = envelope[i] - envelope[i - 1];
          novelty[i] = d > 0 ? d : 0;
        }
        const chunkRate = sampleRate / chunkSize;
        const minLag = Math.max(1, Math.round(chunkRate * 60 / 200));
        const maxLag = Math.round(chunkRate * 60 / 60);
        let bestLag = minLag, bestScore = -Infinity;
        for (let lag = minLag; lag <= maxLag; lag++) {
          let score = 0;
          for (let i = 0; i + lag < numChunks; i++) {
            score += novelty[i] * novelty[i + lag];
          }
          if (score > bestScore) { bestScore = score; bestLag = lag; }
        }
        if (bestScore <= 0) return null;
        let bpm = (60 * chunkRate) / bestLag;
        while (bpm < 70) bpm *= 2;
        while (bpm > 180) bpm /= 2;
        return Math.round(bpm);
      } catch (e) {
        console.error("BPM detection failed:", e);
        return null;
      }
    }

    // ─── Audio ────────────────────────────────────────────────────────────────────
    function makeEngine(ctx, style) {
      function kick(t){
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);
        g.gain.setValueAtTime(1.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
        o.start(t);o.stop(t+0.4);
      }
      function snare(t){
        const len=ctx.sampleRate*0.18,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
        for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
        const src=ctx.createBufferSource();src.buffer=buf;
        const f=ctx.createBiquadFilter();f.type="highpass";f.frequency.value=1800;
        const g=ctx.createGain();src.connect(f);f.connect(g);g.connect(ctx.destination);
        g.gain.setValueAtTime(0.8,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
        src.start(t);src.stop(t+0.22);
      }
      function hat(t,vol=0.3){
        const len=ctx.sampleRate*0.05,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
        for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
        const src=ctx.createBufferSource();src.buffer=buf;
        const f=ctx.createBiquadFilter();f.type="highpass";f.frequency.value=9000;
        const g=ctx.createGain();src.connect(f);f.connect(g);g.connect(ctx.destination);
        g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
        src.start(t);src.stop(t+0.07);
      }
      return (time,bib,spb)=>{
        if(style==="boom-bap"){
          if(bib===0){kick(time);hat(time,0.2);}
          if(bib===1)hat(time,0.25);
          if(bib===2){snare(time);kick(time+spb*0.5);hat(time,0.2);}
          if(bib===3)hat(time,0.3);
        } else if(style==="lofi"){
          if(bib===0)kick(time);
          if(bib===1)hat(time,0.18);
          if(bib===2)snare(time);
          if(bib===3)hat(time,0.14);
          hat(time+spb*0.5,0.08);
        } else {
          if(bib===0||bib===2)kick(time);
          if(bib===1||bib===3)snare(time);
          for(let i=0;i<4;i++)hat(time+(spb/4)*i,0.1+(i%2===0?0.08:0));
        }
      };
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // ROOT
    // ═══════════════════════════════════════════════════════════════════════════════
    function RhymeGame() {
      const [screen,    setScreen]    = useState("landing");
      const [schemeIdx, setSchemeIdx] = useState(0);
      const [sylIdx,    setSylIdx]    = useState(3);
      const [beatIdx,   setBeatIdx]   = useState(0);
      const [durIdx,    setDurIdx]    = useState(1);
      const [bars,      setBars]      = useState([]);
      const [ballSpeed, setBallSpeed] = useState(1);
      const [justFinished, setJustFinished] = useState(false);
      const [themeId,   setThemeId]   = useState("classic");

      const [beats, setBeats] = useState(DEFAULT_BEATS);
      const [wordSets, setWordSets] = useState(() => JSON.parse(JSON.stringify(POOLS)));
      const storageLoaded = useRef(false);
      const [storageReady, setStorageReady] = useState(false);

      const [isPlaying,   setIsPlaying]   = useState(false);
      const [currentBar,  setCurrentBar]  = useState(0);
      const [beatInBar,   setBeatInBar]   = useState(0);
      const [beatFrac,    setBeatFrac]    = useState(0);
      // Number of lead-in "buffer" bars before the freestyle content starts —
      // gives the user time to get in rhythm with the beat before any words
      // appear. These count down (3, 2, 1) instead of showing a word.
      const BUFFER_BARS = 2;
      const [inBuffer,    setInBuffer]    = useState(false);

      const audioCtx  = useRef(null);
      const schedFn   = useRef(null);
      const timerRef  = useRef(null);
      const animRef   = useRef(null);
      const startT    = useRef(0);
      const nextT     = useRef(0);
      const bCount    = useRef(0);
      const rowRefs   = useRef({});
      const scrollRef = useRef(null);

      useEffect(() => {
        (async () => {
          try {
            const savedBeats = await window.storage.get('rhyme_beats', false);
            if (savedBeats && savedBeats.value) {
              const parsed = JSON.parse(savedBeats.value);
              const cleaned = Array.isArray(parsed)
                ? parsed.filter(b => b.style !== "upload" || !!b.url)
                : [];
              if (cleaned.length) setBeats(cleaned);
            }
          } catch (e) { /* nothing saved yet */ }
          try {
            const savedWords = await window.storage.get('rhyme_words', false);
            if (savedWords && savedWords.value) {
              setWordSets(JSON.parse(savedWords.value));
            }
          } catch (e) { /* nothing saved yet */ }
          try {
            const savedTheme = await window.storage.get('rhyme_theme', false);
            if (savedTheme && savedTheme.value && COLOR_THEMES[savedTheme.value]) {
              setThemeId(savedTheme.value);
            }
          } catch (e) { /* nothing saved yet */ }
          storageLoaded.current = true;
          setStorageReady(true);
        })();
      }, []);

      useEffect(() => {
        if (!storageReady) return;
        (async () => {
          try {
            const toSave = beats.map(b => {
              if (b.style === "upload") {
                const { audioData, ...rest } = b;
                return rest;
              }
              return b;
            });
            await window.storage.set('rhyme_beats', JSON.stringify(toSave), false);
          } catch (e) {
            console.error("Could not save beats:", e);
          }
        })();
      }, [beats, storageReady]);

      useEffect(() => {
        if (!storageReady) return;
        (async () => {
          try {
            await window.storage.set('rhyme_words', JSON.stringify(wordSets), false);
          } catch (e) {
            console.error("Could not save word sets:", e);
          }
        })();
      }, [wordSets, storageReady]);

      useEffect(() => {
        if (!storageReady) return;
        (async () => {
          try {
            await window.storage.set('rhyme_theme', themeId, false);
          } catch (e) {
            console.error("Could not save theme:", e);
          }
        })();
      }, [themeId, storageReady]);

      useEffect(() => {
        if (beatIdx > beats.length - 1) setBeatIdx(0);
      }, [beats, beatIdx]);

      const theme   = COLOR_THEMES[themeId] || COLOR_THEMES.classic;
      const scheme  = SCHEMES[schemeIdx];
      const beat    = beats[beatIdx] || beats[0] || DEFAULT_BEATS[0];
      const bpm     = beat.bpm;
      const spb     = 60 / (bpm * ballSpeed);
      const numBars = DURATIONS[durIdx];
      const syl     = SYLLABLE_OPTS[sylIdx];

      useEffect(() => {
        setBars(buildBars(scheme, syl, numBars, wordSets));
      }, [schemeIdx, sylIdx, numBars, wordSets]);

      useEffect(() => {
        if (screen !== "game") return;
        const key = inBuffer ? "buf" : currentBar;
        const el = rowRefs.current[key];
        const cont = scrollRef.current;
        if (!el || !cont) return;
        const target = el.offsetTop - cont.clientHeight * 0.30;
        cont.scrollTo({ top: Math.max(0, target), behavior: "smooth" });
      }, [currentBar, inBuffer, screen]);

      const startSession = () => {
        setBars(buildBars(scheme, syl, numBars, wordSets));
        setCurrentBar(0); setBeatInBar(0); setBeatFrac(0);
        bCount.current = 0; setIsPlaying(false); setJustFinished(false);
        setInBuffer(false);
        setScreen("game");
      };

      const startPlay = useCallback(() => {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) {
          alert("Web Audio API not supported on this browser.");
          return;
        }
        setJustFinished(false);

        if (audioCtx.current) {
          const ctx = audioCtx.current;
          ctx.resume().then(() => {
            if (beat.style !== "upload") {
              const sched = () => {
                while (nextT.current < ctx.currentTime + 0.12) {
                  schedFn.current(nextT.current, bCount.current % 4, spb);
                  nextT.current += spb;
                  bCount.current++;
                }
                timerRef.current = setTimeout(sched, 20);
              };
              sched();
            }
            setIsPlaying(true);
          });
          return;
        }

        const ctx = new AudioContext();
        const resumeAndPlay = () => {
          audioCtx.current = ctx;

          const playDecodedBuffer = (arrayBuffer) => {
            ctx.decodeAudioData(arrayBuffer.slice(0), (buffer) => {
              const src = ctx.createBufferSource();
              src.buffer = buffer;
              src.connect(ctx.destination);
              src.loop = true;
              src.start(0);
              startT.current = ctx.currentTime;
              setIsPlaying(true);
            }, (err) => {
              console.error("Decode error:", err);
              alert("Could not play this beat");
              audioCtx.current = null;
              ctx.close();
            });
          };

          if (beat.style === "upload" && beat.audioData) {
            playDecodedBuffer(beat.audioData);
          } else if (beat.style === "upload" && beat.url) {
            fetch(beat.url)
              .then(res => {
                if (!res.ok) throw new Error("HTTP " + res.status);
                return res.arrayBuffer();
              })
              .then(arrayBuffer => {
                setBeats(prev => prev.map(b => b === beat ? { ...b, audioData: arrayBuffer } : b));
                playDecodedBuffer(arrayBuffer);
              })
              .catch(err => {
                console.error("Fetch error:", err);
                alert("Could not load this beat from the library. Check your connection and try again.");
                audioCtx.current = null;
                ctx.close();
              });
          } else {
            schedFn.current = makeEngine(ctx, beat.style);
            nextT.current = ctx.currentTime + 0.05;
            startT.current = ctx.currentTime + 0.05;
            bCount.current = 0;
            const sched = () => {
              while (nextT.current < ctx.currentTime + 0.12) {
                schedFn.current(nextT.current, bCount.current % 4, spb);
                nextT.current += spb;
                bCount.current++;
              }
              timerRef.current = setTimeout(sched, 20);
            };
            sched();
            setIsPlaying(true);
          }
        };

        const unlock = () => {
          const silentBuf = ctx.createBuffer(1, 1, 22050);
          const silentSrc = ctx.createBufferSource();
          silentSrc.buffer = silentBuf;
          silentSrc.connect(ctx.destination);
          silentSrc.start(0);
        };
        ctx.resume().then(() => {
          unlock();
          resumeAndPlay();
        }).catch((err) => {
          console.error("AudioContext resume failed:", err);
          unlock();
          resumeAndPlay();
        });
      }, [beat.style, beat.audioData, beat.url, spb]);

      const pausePlay = useCallback(() => {
        clearTimeout(timerRef.current);
        cancelAnimationFrame(animRef.current);
        if (audioCtx.current) {
          audioCtx.current.suspend();
        }
        setIsPlaying(false);
      }, []);

      const closeAudio = useCallback(() => {
        clearTimeout(timerRef.current);
        cancelAnimationFrame(animRef.current);
        if (audioCtx.current) {
          const ctx = audioCtx.current;
          audioCtx.current = null;
          ctx.close();
        }
        setIsPlaying(false);
      }, []);

      const finishSession = useCallback(() => {
        closeAudio();
        setJustFinished(true);
        setInBuffer(false);
        setBars(buildBars(scheme, syl, numBars, wordSets));
      }, [closeAudio, scheme, syl, numBars, wordSets]);

      // Timing/animation loop. Runs through BUFFER_BARS "count-in" bars first
      // (no words shown, just a countdown against the beat), then hands off
      // to the normal bar-by-bar freestyle progression.
      useEffect(() => {
        if (!isPlaying) return;
        let lastBar = -1;
        let finished = false;
        const tick = () => {
          const ctx = audioCtx.current;
          if (!ctx) return;
          const elapsed = Math.max(0, ctx.currentTime - startT.current);
          const total   = elapsed / spb;
          const totalBarIdx = Math.floor(total / 4);

          if (totalBarIdx < BUFFER_BARS) {
            setInBuffer(true);
            setBeatInBar(Math.floor(total) % 4);
            setBeatFrac(total % 1);
            if (totalBarIdx !== lastBar) {
              lastBar = totalBarIdx;
              setCurrentBar(-(BUFFER_BARS - totalBarIdx));
            }
            animRef.current = requestAnimationFrame(tick);
            return;
          }

          // Unconditionally clear the buffer flag once we're past the count-in —
          // checking the closed-over `inBuffer` value here was the bug: since
          // this effect doesn't depend on `inBuffer`, that variable is always
          // whatever it was when the effect was created (false), so the old
          // `if (inBuffer)` guard could never actually be true and
          // setInBuffer(false) was never called, leaving "Get Ready" stuck on
          // screen forever after the count-in ended.
          setInBuffer(false);
          const barIdx = totalBarIdx - BUFFER_BARS;

          if (barIdx >= bars.length) {
            if (!finished) {
              finished = true;
              setCurrentBar(bars.length - 1);
              setBeatInBar(3);
              setBeatFrac(0);
              finishSession();
            }
            return;
          }

          setBeatInBar(Math.floor(total) % 4);
          setBeatFrac(total % 1);
          if (barIdx !== lastBar) {
            lastBar = barIdx;
            setCurrentBar(barIdx);
          }
          animRef.current = requestAnimationFrame(tick);
        };
        animRef.current = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(animRef.current);
      }, [isPlaying, spb, bars.length, finishSession]);

      useEffect(() => () => closeAudio(), [closeAudio]);

      const goHome = () => { closeAudio(); setScreen("home"); };

      return (
        <>
          <style>{`
            @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
            @keyframes spin{to{transform:rotate(360deg)}}
          `}</style>

          {screen === "landing" && (
            <LandingScreen onBegin={() => setScreen("home")} theme={theme} />
          )}

          {screen === "home" && (
            <HomeScreen
              schemeIdx={schemeIdx} setSchemeIdx={setSchemeIdx}
              sylIdx={sylIdx}       setSylIdx={setSylIdx}
              beatIdx={beatIdx}     setBeatIdx={setBeatIdx}
              durIdx={durIdx}       setDurIdx={setDurIdx}
              ballSpeed={ballSpeed} setBallSpeed={setBallSpeed}
              bars={bars}           scheme={scheme}
              beats={beats} setBeats={setBeats}
              wordSets={wordSets} setWordSets={setWordSets}
              themeId={themeId} setThemeId={setThemeId} theme={theme}
              onStart={startSession}
            />
          )}

          {screen === "game" && (
            <GameScreen
              bars={bars}
              currentBar={currentBar}
              inBuffer={inBuffer}
              bufferBars={BUFFER_BARS}
              beatInBar={beatInBar}
              beatFrac={beatFrac}
              isPlaying={isPlaying}
              justFinished={justFinished}
              onPlay={startPlay}
              onPause={pausePlay}
              onBack={goHome}
              beatName={beat.name}
              bpm={bpm}
              ballSpeed={ballSpeed}
              scrollRef={scrollRef}
              rowRefs={rowRefs}
              theme={theme}
            />
          )}
        </>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // LANDING

    // ═══════════════════════════════════════════════════════════════════════════════
    // HOME
    // ═══════════════════════════════════════════════════════════════════════════════
    function HomeScreen({ schemeIdx,setSchemeIdx,sylIdx,setSylIdx,
      beatIdx,setBeatIdx,durIdx,setDurIdx,ballSpeed,setBallSpeed,bars,scheme,
      beats,setBeats,wordSets,setWordSets,themeId,setThemeId,theme,onStart }) {
      const [showMore, setShowMore] = useState(false);
      const [settingMode, setSettingMode] = useState(null);
      const syl = SYLLABLE_OPTS[sylIdx];
      const activeBeat = beats[beatIdx] || beats[0];

      if (settingMode === "beats") {
        return (
          <BeatBuilder
            beats={beats}
            setBeats={setBeats}
            activeIdx={beatIdx}
            setActiveIdx={setBeatIdx}
            onBack={() => setSettingMode(null)}
            theme={theme}
          />
        );
      }
      if (settingMode === "words") {
        return <WordBuilder wordSets={wordSets} setWordSets={setWordSets} onBack={() => setSettingMode(null)} theme={theme} />;
      }
      if (settingMode === "theme") {
        return <ThemeBuilder themeId={themeId} setThemeId={setThemeId} onBack={() => setSettingMode(null)} />;
      }

      return (
        <div style={{
          height:"100%",width:"100%",overflowY:"auto",
          background:theme.bg,
          padding:"24px 16px 120px",
          display:"flex",flexDirection:"column",alignItems:"center",
          fontFamily:"'Inter',sans-serif",
          animation:"fadeIn 0.35s ease both",
        }}>
          <div style={{width:"100%",maxWidth:"min(94vw, 640px)"}}>

            {/* ── 1. WORDS ── */}
            <SectionCard num={1} label="WORDS">
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <CircleBtn onClick={()=>setSylIdx(i=>(i-1+SYLLABLE_OPTS.length)%SYLLABLE_OPTS.length)}>‹</CircleBtn>
                <div style={{
                  flex:1,textAlign:"center",
                  fontFamily:"'Nunito'",fontWeight:900,fontSize:19,color:"#fff",
                  display:"flex",alignItems:"center",justifyContent:"center",gap:8,
                }}>
                  <span style={{fontSize:20}}>🔢</span>{syl}
                </div>
                <CircleBtn onClick={()=>setSylIdx(i=>(i+1)%SYLLABLE_OPTS.length)}>›</CircleBtn>
              </div>
              <div style={{
                marginTop:10,fontSize:11,color:"rgba(255,255,255,0.4)",lineHeight:1.4,
              }}>
                Each rhyming pair gets its own random word family, and the next pair switches to a different one — so A lines (orange) and B lines (blue) each stay consistent within a couplet, but the sounds keep changing as the freestyle goes on.
              </div>
              <div style={{display:"flex",gap:8,marginTop:12}}>
                <button onClick={() => setSettingMode("words")} style={{
                  flex:1,background:"rgba(0,0,0,0.15)",color:"#EAB308",
                  borderRadius:12,padding:"10px",fontWeight:700,fontSize:13,
                  border:"1px solid rgba(234,179,8,0.3)",
                }}>✎ Edit Word Sets</button>
                <button onClick={() => setSettingMode("theme")} style={{
                  flex:1,background:"rgba(0,0,0,0.15)",color:theme.accent2,
                  borderRadius:12,padding:"10px",fontWeight:700,fontSize:13,
                  border:`1px solid ${theme.accent2}55`,
                }}>🎨 Color Theme</button>
              </div>
            </SectionCard>

            {/* ── 2. SCHEME ── */}
            <SectionCard num={2} label={`SCHEME: ${scheme.id}`} sub={scheme.desc.toUpperCase()}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <CircleBtn onClick={()=>setSchemeIdx(i=>(i-1+SCHEMES.length)%SCHEMES.length)}>‹</CircleBtn>
                <div style={{flex:1}}>
                  <MiniGrid scheme={scheme} bars={bars.slice(0,4)} theme={theme} />
                </div>
                <CircleBtn onClick={()=>setSchemeIdx(i=>(i+1)%SCHEMES.length)}>›</CircleBtn>
              </div>
            </SectionCard>

            {/* ── 3. BEAT ── */}
            <SectionCard num={3} label="BEAT">
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                <CircleBtn onClick={()=>setBeatIdx(i=>(i-1+beats.length)%beats.length)}>‹</CircleBtn>
                <div style={{
                  flex:1,background:"rgba(0,0,0,0.2)",borderRadius:12,
                  padding:"10px 14px",display:"flex",alignItems:"center",gap:12,
                }}>
                  <div style={{
                    width:44,height:44,borderRadius:8,flexShrink:0,
                    background:"linear-gradient(135deg,#7c3aed,#2563eb)",
                    display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,
                  }}>🎵</div>
                  <div>
                    <div style={{fontFamily:"'Nunito'",fontWeight:900,fontSize:17,color:"#fff"}}>
                      {activeBeat.name}
                    </div>
                    <div style={{fontSize:12,color:"rgba(255,255,255,0.45)"}}>
                      {activeBeat.bpm} BPM
                    </div>
                  </div>
                </div>
                <CircleBtn onClick={()=>setBeatIdx(i=>(i+1)%beats.length)}>›</CircleBtn>
              </div>

              {/* Ball Pace */}
              <div style={{background:"rgba(0,0,0,0.15)",borderRadius:12,padding:"12px 14px",marginBottom:10}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                  <span style={{fontSize:14,fontWeight:600,color:"#fff"}}>Ball Pace</span>
                  <span style={{fontSize:13,fontWeight:700,color:theme.accent2}}>{ballSpeed.toFixed(2)}x Speed</span>
                </div>
                <input type="range" min="0.5" max="2" step="0.05" value={ballSpeed}
                  onChange={e => setBallSpeed(parseFloat(e.target.value))}
                  style={{ width:"100%",cursor:"pointer" }}
                />
                <div style={{display:"flex",justifyContent:"space-between",marginTop:8,fontSize:10,color:"rgba(255,255,255,0.35)"}}>
                  <span>0.5x Slow</span><span>2x Fast</span>
                </div>
              </div>

              <button onClick={()=>setShowMore(p=>!p)} style={{
                background:"none",color:"rgba(255,255,255,0.4)",
                fontSize:12,fontWeight:600,marginBottom:10,display:"flex",alignItems:"center",gap:4,
              }}>
                {showMore?"Less ▲":"More ▼"}
              </button>

              {showMore && (
                <div style={{display:"flex",flexDirection:"column",gap:8,animation:"fadeIn 0.2s ease"}}>
                  {/* Duration */}
                  <div style={{background:"rgba(0,0,0,0.15)",borderRadius:12,padding:"12px 14px"}}>
                    <div style={{fontSize:10,fontWeight:700,letterSpacing:1.5,color:"rgba(255,255,255,0.35)",marginBottom:8}}>DURATION</div>
                    <div style={{display:"flex",gap:6}}>
                      {DUR_LABELS.map((l,i)=>(
                        <button key={l} onClick={()=>setDurIdx(i)} style={{
                          flex:1,padding:"8px 4px",borderRadius:10,
                          background: durIdx===i ? "transparent" : "rgba(255,255,255,0.07)",
                          color:      durIdx===i ? theme.accent : "rgba(255,255,255,0.6)",
                          border:     durIdx===i ? `1.5px solid ${theme.accent}` : "1.5px solid transparent",
                          fontSize:11,fontWeight:700,transition:"all 0.15s",
                        }}>{l}</button>
                      ))}
                    </div>
                  </div>
                  {/* Settings buttons */}
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={() => setSettingMode("beats")} style={{
                      flex:1,background:"rgba(0,0,0,0.15)",color:theme.accent2,
                      borderRadius:12,padding:"10px",fontWeight:700,fontSize:13,
                      border:`1px solid ${theme.accent2}55`,
                    }}>+ Beats</button>
                    <button onClick={() => setSettingMode("words")} style={{
                      flex:1,background:"rgba(0,0,0,0.15)",color:"#EAB308",
                      borderRadius:12,padding:"10px",fontWeight:700,fontSize:13,
                      border:"1px solid rgba(234,179,8,0.3)",
                    }}>+ Words</button>
                  </div>
                </div>
              )}
            </SectionCard>

            {/* Start */}
            <button onClick={onStart} style={{
              width:"100%",padding:"18px",
              background:theme.accent,color:"#fff",
              borderRadius:16,fontFamily:"'Nunito'",fontWeight:900,fontSize:22,
              boxShadow:`0 6px 28px ${theme.accent}80`,border:"none",
              transition:"transform 0.1s",
            }}
            onMouseDown={e=>e.currentTarget.style.transform="scale(0.97)"}
            onMouseUp={e=>e.currentTarget.style.transform="scale(1)"}
            >Start Freestyle ▶</button>
          </div>
        </div>
      );
    }

    function SectionCard({ num, label, sub, children }) {
      return (
        <div style={{
          background:"rgba(255,255,255,0.09)",border:"1px solid rgba(255,255,255,0.12)",
          borderRadius:18,padding:"16px",marginBottom:12,
        }}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
            <div style={{
              width:22,height:22,borderRadius:6,
              background:"rgba(255,255,255,0.15)",
              display:"flex",alignItems:"center",justifyContent:"center",
              fontSize:11,fontWeight:800,color:"#fff",flexShrink:0,
            }}>{num}</div>
            <span style={{fontSize:11,fontWeight:700,letterSpacing:1.5,color:"rgba(255,255,255,0.5)"}}>{label}</span>
            {sub && <span style={{fontSize:10,color:"rgba(255,255,255,0.3)",fontWeight:600}}>({sub})</span>}
          </div>
          {children}
        </div>
      );
    }

    function CircleBtn({ onClick, children }) {
      return (
        <button onClick={onClick} style={{
          width:36,height:36,borderRadius:"50%",flexShrink:0,
          background:"rgba(255,255,255,0.12)",color:"#fff",
          fontSize:18,fontWeight:700,
          border:"1px solid rgba(255,255,255,0.18)",
          display:"flex",alignItems:"center",justifyContent:"center",
        }}>{children}</button>
      );
    }

    function BuilderHeader({ title, onBack }) {
      return (
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
          <button onClick={onBack} style={{
            width:36,height:36,borderRadius:"50%",flexShrink:0,
            background:"rgba(255,255,255,0.12)",color:"#fff",fontSize:18,
            border:"1px solid rgba(255,255,255,0.18)",
            display:"flex",alignItems:"center",justifyContent:"center",
          }}>‹</button>
          <span style={{fontFamily:"'Nunito'",fontWeight:900,fontSize:20,color:"#fff"}}>{title}</span>
        </div>
      );
    }

    function MiniGrid({ scheme, bars, theme }) {
      return (
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          {scheme.pattern.map((grp,i)=>{
            const bar = bars[i];
            // Preview uses the same slot-based coloring (A=orange, B=blue)
            // as the actual game screen, so this accurately shows what the
            // freestyle will look like.
            const col = grp ? slotColor(bar?.slot || grp) : null;
            return (
              <div key={i} style={{display:"flex",gap:5}}>
                {[0,1,2].map(c=>(
                  <div key={c} style={{flex:1,height:32,borderRadius:7,background:"rgba(255,255,255,0.1)"}}/>
                ))}
                <div style={{
                  flex:1,height:32,borderRadius:7,
                  background:col||"rgba(255,255,255,0.08)",
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontFamily:"'Nunito'",fontWeight:900,fontSize:12,
                  color:col?"#111":"rgba(255,255,255,0.2)",
                }}>
                  {bar?.word||(grp||"")}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // THEME BUILDER
    // ═══════════════════════════════════════════════════════════════════════════════
    function ThemeBuilder({ themeId, setThemeId, onBack }) {
      return (
        <div style={{
          height:"100%",width:"100%",overflowY:"auto",
          background:(COLOR_THEMES[themeId]||COLOR_THEMES.classic).bg,
          padding:"24px 16px 60px",
          fontFamily:"'Inter',sans-serif",
          animation:"fadeIn 0.35s ease both",
        }}>
          <div style={{width:"100%",maxWidth:"min(94vw, 640px)",margin:"0 auto"}}>
            <BuilderHeader title="Color Theme" onBack={onBack} />
            <div style={{fontSize:12,color:"rgba(255,255,255,0.45)",marginBottom:18,lineHeight:1.5}}>
              Pick a background and rhyme-family palette. Tap a theme to preview it live.
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {THEME_IDS.map(id=>{
                const t = COLOR_THEMES[id];
                const active = id===themeId;
                const sampleGroups = ["A","B","C","D","E","F"];
                return (
                  <button key={id} onClick={()=>setThemeId(id)} style={{
                    textAlign:"left",borderRadius:16,padding:14,
                    background: active ? "rgba(255,255,255,0.18)" : "rgba(255,255,255,0.08)",

                    display:"flex",flexDirection:"column",gap:10,
                  }}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                      <span style={{fontFamily:"'Nunito'",fontWeight:900,fontSize:15,color:"#fff"}}>{t.label}</span>
                      {active && <span style={{fontSize:11,fontWeight:800,color:"#fff"}}>✓ ACTIVE</span>}
                    </div>
                    <div style={{
                      height:34,borderRadius:8,background:t.bg,
                      display:"flex",alignItems:"center",gap:6,padding:"0 8px",
                    }}>
                      {sampleGroups.map(g=>(
                        <div key={g} style={{
                          width:20,height:20,borderRadius:5,background:t.rhyme[g],

    // ═══════════════════════════════════════════════════════════════════════════════
    // BEAT BUILDER
    // ═══════════════════════════════════════════════════════════════════════════════
    function BeatBuilder({ beats, setBeats, activeIdx, setActiveIdx, onBack, theme }) {
      const [name, setName]   = useState("");
      const [bpm,  setBpm]    = useState(95);
      const [style,setStyle]  = useState("boom-bap");
      const [previewIdx, setPreviewIdx] = useState(null);
      const [uploadName, setUploadName] = useState("");
      const [uploadFile, setUploadFile] = useState(null);
      const [uploadBpm, setUploadBpm] = useState(95);
      const [editIdx, setEditIdx] = useState(null);
      const [editName, setEditName] = useState("");
      const [editBpm, setEditBpm] = useState(90);

      const [libraryBusy, setLibraryBusy] = useState(null);
      const [libraryError, setLibraryError] = useState(null);
      const [customUrl, setCustomUrl] = useState("");
      const [customName, setCustomName] = useState("");
      const [customBpm, setCustomBpm] = useState(95);
      const [customBusy, setCustomBusy] = useState(false);
      const [customError, setCustomError] = useState(null);

      const previewCtx  = useRef(null);
      const previewTimer= useRef(null);
      const uploadAudioRef = useRef(null);

      const stopPreview = useCallback(() => {
        clearTimeout(previewTimer.current);
        previewCtx.current?.close();
        previewCtx.current = null;
        setPreviewIdx(null);
      }, []);

      useEffect(() => () => {
        stopPreview();
        uploadAudioRef.current?.close();
      }, [stopPreview]);

      function togglePreview(idx, b) {
        if (previewIdx === idx) { stopPreview(); return; }
        if (b.style === "upload") {
          previewUploadedBeat(b, idx);
        } else {
          stopPreview();
          const ctx = new (window.AudioContext||window.webkitAudioContext)();
          if (ctx.state === 'suspended') {
            ctx.resume();
          }
          previewCtx.current = ctx;
          const sched = makeEngine(ctx, b.style);
          const spb = 60 / b.bpm;
          let next = ctx.currentTime + 0.05;
          let count = 0;
          const loop = () => {
            while (next < ctx.currentTime + 0.12) {
              sched(next, count % 4, spb);
              next += spb;
              count++;
            }
            previewTimer.current = setTimeout(loop, 20);
          };
          loop();
          setPreviewIdx(idx);
        }
      }

      function addBeat() {
        const trimmed = name.trim();
        if (!trimmed) return;
        const clampedBpm = Math.max(40, Math.min(220, Math.round(bpm) || 90));
        setBeats(prev => [...prev, { name: trimmed, bpm: clampedBpm, style }]);
        setName(""); setBpm(95); setStyle("boom-bap");
      }

      function deleteBeat(idx) {
        if (beats.length <= 1) return;
        stopPreview();
        setBeats(prev => prev.filter((_,i)=>i!==idx));
        if (activeIdx >= idx && activeIdx > 0) setActiveIdx(activeIdx - 1);
        if (editIdx === idx) setEditIdx(null);
      }

      function openEdit(idx, b) {
        setEditIdx(idx);
        setEditName(b.name);
        setEditBpm(b.bpm);
      }

      function saveEdit(idx) {
        const trimmed = editName.trim();
        if (!trimmed) return;
        const clampedBpm = Math.max(40, Math.min(220, Math.round(editBpm) || 90));
        setBeats(prev => prev.map((b,i) => i===idx ? { ...b, name: trimmed, bpm: clampedBpm } : b));
        setEditIdx(null);
      }

      const ACCEPTED_AUDIO_EXTS = ['.m4a','.mp3','.wav','.ogg','.aac'];

      function handleFileSelect(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        const lower = file.name.toLowerCase();
        if (!ACCEPTED_AUDIO_EXTS.some(ext => lower.endsWith(ext))) {
          alert("Please select an audio file (MP3, WAV, M4A, OGG, or AAC)");
          return;
        }
        setUploadFile(file);
      }

      function uploadBeat() {
        if (!uploadFile || !uploadName.trim()) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const data = e.target?.result;
          if (!data) return;
          const beat = {
            name: uploadName.trim(),
            bpm: Math.max(40, Math.min(220, Math.round(uploadBpm) || 90)),
            style: "upload",
            audioData: data,
          };
          setBeats(prev => [...prev, beat]);
          setUploadName("");
          setUploadFile(null);
          setUploadBpm(95);
        };
        reader.readAsArrayBuffer(uploadFile);
      }

      async function addLibraryBeat(item) {
        setLibraryError(null);
        setLibraryBusy(item.name);
        try {
          const directUrl = await resolveCommonsFileUrl(item.file);
          const res = await fetch(directUrl);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const arrayBuffer = await res.arrayBuffer();
          setBeats(prev => [...prev, {
            name: item.name,
            bpm: item.bpm,
            style: "upload",
            url: directUrl,
            credit: item.credit,
            audioData: arrayBuffer,
          }]);
        } catch (err) {
          console.error("Library fetch error:", err);
          setLibraryError("Couldn't load \"" + item.name + "\" — check your connection and try again.");
        } finally {
          setLibraryBusy(null);
        }
      }

      const alreadyAdded = (name) => beats.some(b => b.name === name);

      async function addCustomUrlBeat() {
        const rawUrl = customUrl.trim();
        const trimmedName = customName.trim();
        if (!rawUrl || !trimmedName) return;
        setCustomError(null);
        setCustomBusy(true);
        try {
          const url = await resolveDirectAudioUrl(rawUrl);
          const res = await fetch(url);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const arrayBuffer = await res.arrayBuffer();
          setBeats(prev => [...prev, {
            name: trimmedName,
            bpm: Math.max(40, Math.min(220, Math.round(customBpm) || 90)),
            style: "upload",
            url,
            credit: "Added from URL",
            audioData: arrayBuffer,
          }]);
          setCustomUrl(""); setCustomName(""); setCustomBpm(95);
        } catch (err) {
          console.error("Custom URL fetch error:", err);
          setCustomError("Couldn't load that link. Many sites block direct audio fetches (CORS) — Wikimedia Commons / archive.org direct file links tend to work best.");
        } finally {
          setCustomBusy(false);
        }
      }

      function previewUploadedBeat(beat, idx) {
        stopPreview();
        const play = (arrayBuffer) => {
          const ctx = new (window.AudioContext||window.webkitAudioContext)();
          if (ctx.state === 'suspended') ctx.resume();
          uploadAudioRef.current = ctx;
          ctx.decodeAudioData(arrayBuffer.slice(0), (buffer) => {
            const src = ctx.createBufferSource();
            src.buffer = buffer;
            src.connect(ctx.destination);
            src.start(0);
            src.onended = () => setPreviewIdx(null);
            setPreviewIdx(idx);
          }, (err) => {
            console.error("Decode error:", err);
            alert("Could not play this beat file");
          });
        };
        if (beat.audioData) {
          play(beat.audioData);
        } else if (beat.url) {
          setLibraryBusy(beat.name);
          fetch(beat.url).then(res => res.arrayBuffer()).then(arrayBuffer => {
            setBeats(prev => prev.map(b => b === beat ? { ...b, audioData: arrayBuffer } : b));
            setLibraryBusy(null);
            play(arrayBuffer);
          }).catch(err => {
            console.error("Fetch error:", err);
            setLibraryBusy(null);
            alert("Could not load this beat's audio.");
          });
        }
      }

      return (
        <div style={{
          height:"100%",width:"100%",overflowY:"auto",
          background:theme.bg,
          padding:"24px 16px 60px",
          fontFamily:"'Inter',sans-serif",
          animation:"fadeIn 0.35s ease both",
        }}>
          <style>{`
            @keyframes spin{to{transform:rotate(360deg)}}
          `}</style>
          <div style={{width:"100%",maxWidth:"min(94vw, 640px)",margin:"0 auto"}}>
            <BuilderHeader title="Custom Beats" onBack={() => { stopPreview(); onBack(); }} />

            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
              {beats.map((b,idx)=>(
                <div key={idx} style={{
                  display:"flex",flexDirection:"column",gap:10,
                  background: idx===activeIdx ? `${theme.accent}29` : "rgba(255,255,255,0.09)",
                  border: idx===activeIdx ? `1px solid ${theme.accent}80` : "1px solid rgba(255,255,255,0.12)",
                  borderRadius:14,padding:"10px 12px",
                }}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <button onClick={()=>togglePreview(idx,b)} style={{
                      width:38,height:38,borderRadius:"50%",flexShrink:0,
                      background: previewIdx===idx ? theme.accent : "rgba(255,255,255,0.14)",
                      color:"#fff",fontSize:15,
                      display:"flex",alignItems:"center",justifyContent:"center",
                    }}>
                      {libraryBusy===b.name ? "⋯" : previewIdx===idx ? "⏸" : "▶"}
                    </button>

                    <button onClick={()=>setActiveIdx(idx)} style={{
                      flex:1,textAlign:"left",background:"none",minWidth:0,
                    }}>
                      <div style={{fontFamily:"'Nunito'",fontWeight:800,fontSize:15,color:"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{b.name}</div>
                      <div style={{fontSize:11,color:"rgba(255,255,255,0.45)"}}>
                        {b.bpm} BPM · {b.credit ? "Online" : (BEAT_STYLE_LABELS[b.style]||b.style)}
                      </div>
                    </button>

                    {idx===activeIdx && (
                      <span style={{fontSize:10,fontWeight:800,color:theme.accent,marginRight:2,flexShrink:0}}>SELECTED</span>
                    )}

                    <button onClick={()=>openEdit(idx,b)} style={{
                      width:30,height:30,borderRadius:"50%",flexShrink:0,
                      background:"rgba(255,255,255,0.08)",color:theme.accent2,fontSize:13,
                      display:"flex",alignItems:"center",justifyContent:"center",
                    }}>✎</button>

                    <button onClick={()=>deleteBeat(idx)} disabled={beats.length<=1} style={{
                      width:30,height:30,borderRadius:"50%",flexShrink:0,
                      background:"rgba(255,255,255,0.08)",
                      color: beats.length<=1 ? "rgba(255,255,255,0.2)" : "#fca5a5",
                      fontSize:14,
                      display:"flex",alignItems:"center",justifyContent:"center",
                      opacity: beats.length<=1 ? 0.5 : 1,
                    }}>✕</button>
                  </div>

                  {b.credit && (
                    <div style={{fontSize:10,color:"rgba(255,255,255,0.32)",paddingLeft:48}}>{b.credit}</div>
                  )}

                  {editIdx === idx && (
                    <div style={{
                      background:"rgba(0,0,0,0.2)",borderRadius:10,padding:12,
                      display:"flex",flexDirection:"column",gap:10,animation:"fadeIn 0.15s ease",
                    }}>
                      <div>
                        <div style={{fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:5}}>Name</div>
                        <input value={editName} onChange={e=>setEditName(e.target.value)} style={{
                          width:"100%",padding:"8px 10px",borderRadius:8,
                          background:"rgba(0,0,0,0.25)",border:"1px solid rgba(255,255,255,0.15)",
                          color:"#fff",fontSize:14,fontFamily:"inherit",
                        }}/>
                      </div>
                      <div>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                          <span style={{fontSize:10,color:"rgba(255,255,255,0.45)"}}>Tempo</span>
                          <span style={{fontSize:11,fontWeight:700,color:theme.accent2}}>{editBpm} BPM</span>
                        </div>
                        <input type="range" min="40" max="220" step="1" value={editBpm}
                          onChange={e=>setEditBpm(parseInt(e.target.value,10))}
                          style={{width:"100%",cursor:"pointer"}}/>
                      </div>
                      <div style={{display:"flex",gap:8}}>
                        <button onClick={()=>setEditIdx(null)} style={{
                          flex:1,padding:"9px",borderRadius:10,
                          background:"rgba(255,255,255,0.1)",color:"rgba(255,255,255,0.7)",
                          fontWeight:700,fontSize:12,
                        }}>Cancel</button>
                        <button onClick={()=>saveEdit(idx)} disabled={!editName.trim()} style={{
                          flex:1,padding:"9px",borderRadius:10,
                          background: editName.trim() ? theme.accent2 : "rgba(255,255,255,0.1)",
                          color: editName.trim() ? "#111" : "rgba(255,255,255,0.35)",
                          fontWeight:800,fontSize:12,
                        }}>Save</button>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>

            {/* Online beat library */}
            <div style={{
              background:"rgba(255,255,255,0.09)",border:"1px solid rgba(255,255,255,0.12)",
              borderRadius:18,padding:16,marginBottom:16,
            }}>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:1.5,color:"rgba(255,255,255,0.5)",marginBottom:6}}>ONLINE BEAT LIBRARY</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:14,lineHeight:1.4}}>
                Free, rights-cleared instrumentals — added straight to your beat list, no download needed.
              </div>

              <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
                {QUICK_PICK_BEATS.map(item=>{
                  const added = alreadyAdded(item.name);
                  const busy = libraryBusy===item.name;
                  return (
                    <div key={item.name} style={{
                      display:"flex",alignItems:"center",gap:10,
                      background:"rgba(0,0,0,0.15)",borderRadius:12,padding:"10px 12px",
                    }}>
                      <div style={{
                        width:36,height:36,borderRadius:8,flexShrink:0,
                        background:"linear-gradient(135deg,#7c3aed,#2563eb)",
                        display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,
                      }}>🌐</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontFamily:"'Nunito'",fontWeight:800,fontSize:13,color:"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.name}</div>
                        <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>{item.bpm} BPM · {item.credit}</div>
                      </div>
                      <button onClick={()=>addLibraryBeat(item)} disabled={added||busy} style={{
                        flexShrink:0,padding:"8px 14px",borderRadius:10,
                        background: added ? "rgba(34,197,94,0.2)" : busy ? "rgba(255,255,255,0.1)" : theme.accent2,
                        color: added ? "#22C55E" : busy ? "rgba(255,255,255,0.5)" : "#111",
                        fontWeight:800,fontSize:12,
                        display:"flex",alignItems:"center",gap:6,
                      }}>
                        {busy && (
                          <span style={{
                            width:11,height:11,borderRadius:"50%",
                            border:"2px solid rgba(0,0,0,0.25)",borderTopColor:"rgba(255,255,255,0.7)",

                        {added ? "Added ✓" : busy ? "Loading" : "+ Add"}

                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  <input value={customName} onChange={e=>setCustomName(e.target.value)} placeholder="Beat name"
                    style={{
                      width:"100%",padding:"9px 12px",borderRadius:10,
                      background:"rgba(0,0,0,0.2)",border:"1px solid rgba(255,255,255,0.15)",

                  <input value={customUrl} onChange={e=>setCustomUrl(e.target.value)} placeholder="https://... direct link to an mp3/ogg/wav"
                    style={{

                      background:"rgba(0,0,0,0.2)",border:"1px solid rgba(255,255,255,0.15)",
                      color:"#fff",fontSize:13,fontFamily:"inherit",

                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{fontSize:11,color:"rgba(255,255,255,0.4)",flexShrink:0}}>Tempo</span>
                    <input type="range" min="40" max="220" step="1" value={customBpm}
                      onChange={e=>setCustomBpm(parseInt(e.target.value,10))}
                      style={{flex:1,cursor:"pointer"}}/>
                    <span style={{fontSize:12,fontWeight:700,color:theme.accent2,width:52,textAlign:"right",flexShrink:0}}>{customBpm} BPM</span>
                  </div>
                  <button onClick={addCustomUrlBeat} disabled={!customUrl.trim()||!customName.trim()||customBusy} style={{
                    width:"100%",padding:"11px",borderRadius:10,
                    background: (customUrl.trim()&&customName.trim()&&!customBusy) ? theme.accent2 : "rgba(255,255,255,0.1)",
                    color: (customUrl.trim()&&customName.trim()&&!customBusy) ? "#111" : "rgba(255,255,255,0.35)",
                    fontFamily:"'Nunito'",fontWeight:900,fontSize:14,

            <div style={{
              background:"rgba(255,255,255,0.09)",border:"1px solid rgba(255,255,255,0.12)",

              <div style={{marginBottom:12}}>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.45)",marginBottom:6}}>Name</div>
                <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Drill, West Coast..."

                  }}/>

              <div style={{marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                  <span style={{fontSize:11,color:"rgba(255,255,255,0.45)"}}>Tempo</span>
                  <span style={{fontSize:12,fontWeight:700,color:theme.accent2}}>{bpm} BPM</span>
                </div>
                <input type="range" min="40" max="220" step="1" value={bpm}
                  onChange={e=>setBpm(parseInt(e.target.value,10))}

              <div style={{marginBottom:16}}>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.45)",marginBottom:6}}>Drum Style</div>
                <div style={{display:"flex",gap:6}}>
                  {BEAT_STYLES.map(s=>(
                    <button key={s} onClick={()=>setStyle(s)} style={{
                      flex:1,padding:"9px 4px",borderRadius:10,
                      background: style===s ? "#fff" : "rgba(255,255,255,0.08)",

                    }}>{BEAT_STYLE_LABELS[s]}</button>

              <button onClick={addBeat} disabled={!name.trim()} style={{
                width:"100%",padding:"13px",borderRadius:12,

              background:"rgba(255,255,255,0.09)",border:"1px solid rgba(255,255,255,0.12)",

                <div style={{fontSize:11,color:"rgba(255,255,255,0.45)",marginBottom:6}}>Beat Name</div>

                <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",marginTop:4}}>Set to 0 to ignore BPM</div>
              </div>

              <button onClick={uploadBeat} disabled={!uploadFile || !uploadName.trim()} style={{
                width:"100%",padding:"13px",borderRadius:12,
                background: (uploadFile && uploadName.trim()) ? theme.accent2 : "rgba(255,255,255,0.1)",
                color: (uploadFile && uploadName.trim()) ? "#111" : "rgba(255,255,255,0.35)",
                fontFamily:"'Nunito'",fontWeight:900,fontSize:15,
              }}>+ Upload Beat</button>
            </div>
          </div>

      );
